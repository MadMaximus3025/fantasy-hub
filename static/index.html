<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Data-Dense Dashboard (ui-ux-pro-max). Light = "Analytics Dashboard" palette, dark = "Financial Dashboard" palette. */
  :root {
    color-scheme: light dark;
    /* color */
    --bg:#f8fafc; --card:#fff; --line:#dbeafe; --text:#1e3a8a; --muted:#475569; --text-2:#334155;
    --accent:#d97706; --on-accent:#000; --accent-line:#b45309; --win:#166534; --loss:#b91c1c;
    --surface-2:#e9eef6; --row-hover:#f1f5fb; --focus:#1e40af;
    /* type */
    --font:"Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num:"Fira Code", ui-monospace, monospace;
    --fs-xs:12px; --fs-sm:12px; --fs-md:14px; --fs-lg:18px; --fs-xl:24px; --lh:1.4;
    /* spacing, size, radius, shadow, motion */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --row-h:36px; --tap:24px;
    --r-sm:4px; --r-md:6px; --r-pill:999px;
    --shadow:0 1px 2px rgb(15 23 42 / .06);
    --dur:150ms;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#020617; --card:#0f172a; --line:#334155; --text:#f8fafc; --muted:#94a3b8; --text-2:#cbd5e1;
      --accent:#f59e0b; --accent-line:#f59e0b; --win:#22c55e; --loss:#f87171;
      --surface-2:#1e293b; --row-hover:#162036; --focus:#fff; --shadow:none;
    }
  }
  @media (pointer: coarse) { :root { --tap:44px; } }
  @media (prefers-reduced-motion: reduce) { :root { --dur:0ms; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:var(--fs-md)/var(--lh) var(--font); font-variant-numeric:tabular-nums; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  header { display:flex; align-items:center; justify-content:space-between; padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--line); margin-bottom:var(--sp-2); }
  header h1 { margin:0; font-size:var(--fs-lg); font-weight:700; }
  header small { color:var(--muted); display:block; font-weight:400; font-size:var(--fs-sm); }
  .refresh { display:flex; flex-direction:column; align-items:flex-end; gap:var(--sp-1); }
  main { display:grid; grid-template-columns: 1.6fr 1fr; gap:var(--sp-2); padding:0 var(--sp-4) var(--sp-4); }
  main.planner { grid-template-columns: 1fr 1.8fr; }
  @media (max-width: 900px) { main, main.planner { grid-template-columns:1fr; } }
  .nav-row { display:flex; gap:var(--sp-2); }
  .nav-row { flex-wrap:wrap; justify-content:flex-end; }
  .nav-row a.button:not([aria-current]) { background:transparent; color:var(--text); border:1px solid var(--line); }
  .drop { display:flex; align-items:center; gap:var(--sp-2); min-height:var(--tap); border-bottom:1px solid var(--line); cursor:pointer; }
  .drop input { width:18px; height:18px; accent-color:var(--focus); flex:none; }
  .drop small { display:block; color:var(--muted); }
  .acq { display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2); margin:var(--sp-3) 0; }
  .acq input { width:4.5em; min-height:var(--tap); border:1px solid var(--line); border-radius:var(--r-sm); background:var(--card); color:var(--text); font:600 var(--fs-md) var(--font-num); padding:0 var(--sp-2); }
  .moves { list-style:none; padding:0; margin:0; }
  .moves li { border-bottom:1px solid var(--line); padding:var(--sp-2) 0; }
  .moves .when { font-family:var(--font-num); color:var(--muted); margin-right:var(--sp-2); }
  .moves .add { color:var(--win); font-weight:700; } .moves .dropped { color:var(--loss); font-weight:700; }
  a.button { display:inline-flex; align-items:center; min-height:var(--tap); padding:0 var(--sp-3); border-radius:var(--r-pill); background:var(--accent); color:var(--on-accent); font:600 var(--fs-sm) var(--font); text-decoration:none; }
  .bar-row { display:grid; grid-template-columns: 4.5em 1fr auto; align-items:center; gap:var(--sp-2); padding:var(--sp-1) 0; font-size:var(--fs-sm); }
  .bar-day { color:var(--muted); font-weight:600; }
  .bars { display:grid; gap:2px; background:var(--surface-2); border-radius:var(--r-sm); padding:2px; }
  .bar { display:block; height:6px; border-radius:3px; }
  .bar.you { background:var(--focus); } .bar.opp { background:var(--loss); }
  .bar-n { font-family:var(--font-num); white-space:nowrap; }
  .tg-row { display:flex; gap:var(--sp-3); align-items:flex-start; padding:var(--sp-2) 0; border-top:1px solid var(--line); }
  .tg-n { font:700 var(--fs-lg) var(--font-num); min-width:1.5em; }
  .tg-teams { display:flex; flex-wrap:wrap; gap:var(--sp-1); }
  .chip.mine { border:2px solid var(--focus); color:var(--text); font-weight:700; }
  .chip[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .guide th small, .guide td small { display:block; color:var(--muted); font:var(--fs-xs) var(--font); }
  .guide th, .guide td { white-space:nowrap; text-align:center; }
  .guide tbody th, .guide thead th:nth-child(2) { text-align:left; }
  .guide td[class^="st-"] { color:var(--muted); }
  .guide td.st-out { color:var(--loss); }
  .guide .wk { font-weight:700; background:var(--surface-2); }
  .guide td.real { font-weight:700; color:var(--text); }
  .guide .expand { background:none; border:0; padding:0; min-height:var(--tap); color:var(--text); font:600 var(--fs-md) var(--font); filter:none; }
  .guide .expand:hover { text-decoration:underline; }
  .guide tr.detail th, .guide tr.detail td { font-size:var(--fs-sm); background:var(--row-hover); }
  .guide tr.detail th { color:var(--muted); padding-left:var(--sp-4); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--sp-3); min-width:0; box-shadow:var(--shadow); }
  .card h2 { margin:0 0 var(--sp-2); font-size:var(--fs-sm); font-weight:600; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; }
  button { display:inline-flex; align-items:center; gap:var(--sp-1); background:var(--accent); color:var(--on-accent); border:0; border-radius:var(--r-pill); padding:0 var(--sp-3); min-height:var(--tap); font:600 var(--fs-sm) var(--font); cursor:pointer; transition:background-color var(--dur), filter var(--dur); }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:hover { filter:brightness(1.08); }
  button.ghost:hover { background:var(--row-hover); filter:none; }
  button svg { width:12px; height:12px; transition:transform var(--dur); }
  button[aria-expanded="true"] svg { transform:rotate(180deg); }
  .player { border-bottom:1px solid var(--line); padding:var(--sp-1); min-height:var(--row-h); transition:background-color var(--dur); }
  .player:hover { background:var(--row-hover); }
  .player > .row { cursor:pointer; }
  .player:last-child { border-bottom:0; }
  .row { display:flex; align-items:center; gap:var(--sp-2); }
  .row img { width:28px; height:28px; border-radius:50%; background:var(--surface-2); object-fit:cover; flex:none; }
  .name { font-weight:600; }
  .meta { color:var(--muted); font-size:var(--fs-xs); letter-spacing:.5px; text-transform:uppercase; }
  .tag { margin-left:auto; display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .inj { color:var(--loss); font-weight:700; font-size:var(--fs-sm); }
  .gl { color:var(--muted); font:var(--fs-sm) var(--font-num); white-space:nowrap; }
  .news { margin:var(--sp-1) 0 var(--sp-1) 36px; display:none; }
  .news.open { display:block; }
  .news p { margin:var(--sp-1) 0; color:var(--text-2); }
  .news b { color:var(--text); }
  .games { list-style:none; margin:var(--sp-1) 0; padding:0; display:flex; flex-wrap:wrap; gap:var(--sp-1); }
  .games li { font-size:var(--fs-sm); color:var(--text-2); }
  .chip { background:transparent; color:var(--text-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:0 var(--sp-2); font-weight:500; }
  .chip:hover, .chip[aria-expanded="true"] { background:var(--row-hover); border-color:var(--focus); filter:none; }
  .h2h { position:absolute; z-index:10; width:min(560px, calc(100vw - 32px)); background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:0 8px 24px rgb(0 0 0 / .25); padding:var(--sp-3); }
  .h2h-head { display:flex; justify-content:space-between; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-2); }
  .h2h-scroll { overflow-x:auto; }
  .breakdown { margin-top:var(--sp-3); }
  .breakdown summary { cursor:pointer; font-weight:600; min-height:var(--tap); display:flex; align-items:center; }
  .breakdown h3 { margin:var(--sp-3) 0 var(--sp-1); font-size:var(--fs-sm); color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .breakdown th, .breakdown td { white-space:nowrap; }
  .breakdown tr.sum td, .breakdown tr.sum th { font-weight:700; border-top:2px solid var(--line); }
  .h2h th, .h2h td { white-space:nowrap; }
  .h2h small, .breakdown small { display:block; color:var(--muted); font:var(--fs-xs) var(--font); }
  .muted { color:var(--muted); margin:0; }
  .games span { font-family:var(--font-num); color:var(--muted); margin-right:var(--sp-1); }
  .score { display:flex; align-items:baseline; gap:var(--sp-2); flex-wrap:wrap; }
  .score .diff { margin-left:auto; }
  .slate-head { display:flex; justify-content:space-between; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-2); }
  .slate-head h2 { margin:0; }
  .picker { display:flex; align-items:center; gap:var(--sp-1); }
  .picker button { padding:0 var(--sp-2); }
  .picker select { min-height:var(--tap); border:1px solid var(--line); border-radius:var(--r-pill); background:var(--card); color:var(--text); font:600 var(--fs-sm) var(--font); padding:0 var(--sp-2); }
  .picker :disabled { opacity:.5; cursor:default; }
  .score .big { font:700 var(--fs-xl) var(--font-num); }
  .score .vs { color:var(--muted); }
  .diff { font:600 var(--fs-md) var(--font-num); }
  .diff.pos { color:var(--win); } .diff.neg { color:var(--loss); }
  .days { display:grid; grid-template-columns:repeat(7,1fr); gap:var(--sp-1); }
  .day { border:1px solid var(--line); border-radius:var(--r-sm); text-align:center; padding:var(--sp-1) 0; }
  .day.today { border:2px solid var(--accent-line); }
  .day.past { background:var(--surface-2); }
  .day.past .n { color:var(--muted); }
  .day .d { font-size:var(--fs-sm); color:var(--muted); font-weight:600; }
  .day .n { font:700 var(--fs-lg) var(--font-num); }
  .day .o { font:700 var(--fs-lg) var(--font-num); color:var(--muted); border-top:1px solid var(--line); margin:0 var(--sp-1); }
  .day .dn { font-size:var(--fs-sm); color:var(--muted); }
  .day .nba, .day .st { font-size:var(--fs-xs); color:var(--muted); }
  .day .st { min-height:1lh; }
  .legend { display:flex; gap:var(--sp-3); margin:var(--sp-2) 0 0; font-size:var(--fs-xs); color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  th, td { height:var(--row-h); padding:0 var(--sp-2); text-align:right; border-bottom:1px solid var(--line); }
  td { font-family:var(--font-num); }
  tbody tr { transition:background-color var(--dur); }
  tbody tr:hover { background:var(--row-hover); }
  th:first-child, td:first-child { text-align:left; font-family:var(--font); }
  th { color:var(--muted); font-size:var(--fs-sm); font-weight:600; }
  td.W { color:var(--win); font-weight:700; } td.L { color:var(--loss); font-weight:700; } td.T { color:var(--muted); }
  .stack { display:grid; gap:var(--sp-2); align-content:start; min-width:0; }
  .error { color:var(--loss); padding:var(--sp-4); }
</style>
</head>
<body>
<header>
  <h1 id="team">Loading…<small id="league"></small></h1>
  <div class="refresh">
    <nav class="nav-row" aria-label="Pages"><a class="button" href="#">Dashboard</a><a class="button" href="#planner">Weekly planner</a><a class="button" href="#streaming">Streaming</a><button id="refresh" class="ghost">Refresh</button></nav>
    <small id="updated" aria-live="polite"></small>
  </div>
</header>
<main id="app"></main>
<div id="h2h" class="h2h" role="dialog" aria-labelledby="h2h-title" hidden>
  <div class="h2h-head"><strong id="h2h-title"></strong><button class="ghost" type="button" aria-label="Close" onclick="closeH2H()"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.75"/></svg></button></div>
  <div id="h2h-body"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (c, v) => c.endsWith("%") ? Number(v).toFixed(3).replace(/^0/, "") : Math.round(v);
const headshot = id => `https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;

const gameDay = iso => new Date(iso + "T00:00").toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" });

function rosterCard(d) {
  const rows = d.roster.map((p, i) => `
    <div class="player">
      <div class="row">
        <img src="${headshot(p.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.pos)} · ${esc(p.team)}</div></div>
        <div class="tag">
          ${p.injury ? `<span class="inj">${esc(p.injury.replace("_", " "))}</span>` : ""}
          <span class="gl">${p.games_left} G left</span>
          <button data-news="${i}" aria-expanded="false" aria-controls="news-${i}">Games${p.news.length ? ` · ${p.news.length} news` : ""} <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.75"/></svg></button>
        </div>
      </div>
      <div class="news" id="news-${i}">
        <ul class="games" aria-label="Games left this matchup">${p.upcoming.length
          ? p.upcoming.map(g => `<li><button class="chip" data-h2h="${p.id}" data-opp="${esc(g.opp)}" data-name="${esc(p.name)}" aria-haspopup="dialog" aria-expanded="false"><span>${gameDay(g.date)}</span> vs ${esc(g.opp)}</button></li>`).join("")
          : "<li>No games left this matchup</li>"}</ul>
        ${p.news.map(n => `<p><b>${esc(n.headline)}</b><br>${esc(n.tldr)}</p>`).join("")}
      </div>
    </div>`).join("");
  return `<section class="card"><h2>Roster · ${d.roster.length} players</h2>${rows}</section>`;
}

function weekPicker(d) {
  const w = d.week, opts = Array.from({ length: w.count }, (_, i) => i + 1)
    .map(n => `<option value="${n}" ${n === w.number ? "selected" : ""}>Week ${n}${n === w.current ? " (now)" : ""}</option>`).join("");
  return `<div class="picker">
      <button class="ghost" data-week="${w.number - 1}" aria-label="Previous week" ${w.number <= 1 ? "disabled" : ""}>‹</button>
      <select id="week" aria-label="Matchup week">${opts}</select>
      <button class="ghost" data-week="${w.number + 1}" aria-label="Next week" ${w.number >= w.count ? "disabled" : ""}>›</button>
    </div>`;
}

const weekDays = d => {
  const start = new Date(d.week.start + "T00:00");
  return d.slate.mine.map((_, i) => new Date(start.getTime() + i * 864e5));
};

// ---- Streaming page (#streaming) ----
const stream = { data: null, plan: null, acq: null, loading: false, error: null };
let drops;  // player ids you're willing to drop; remembered in this browser only
try { drops = new Set(JSON.parse(localStorage.getItem("drops") || "[]")); } catch { drops = new Set(); }

async function loadStream(plan = false) {
  stream.loading = true;
  if (location.hash === "#streaming" && lastData) render(lastData);
  try {
    const q = new URLSearchParams({ drops: [...drops].join(",") });
    if (stream.acq !== null && stream.acq !== "") q.set("acq", stream.acq);
    if (plan) q.set("plan", "true");
    const r = await fetch("/api/stream?" + q);
    const j = await r.json().catch(() => ({ detail: `${r.status} ${r.statusText}` }));
    if (!r.ok) throw new Error(j.detail);
    stream.data = j;
    if (plan) stream.plan = j.plan || null;
    stream.error = null;
  } catch (e) {
    stream.error = e.message;
  }
  stream.loading = false;
  if (location.hash === "#streaming" && lastData) render(lastData);
}

function streamView() {
  if (!stream.data) {
    if (!stream.loading && !stream.error) loadStream();
    return `<section class="card">${stream.error ? `<p class="error">Could not load: ${esc(stream.error)}</p>` : '<p class="muted">Loading roster…</p>'}</section>`;
  }
  const s = stream.data, a = s.acquisitions;
  const acqNote = a.left != null ? `ESPN: ${a.left} left this matchup (${a.used} of ${a.limit} used)${a.daily_limit ? ` · max ${a.daily_limit} a day` : ""}`
    : a.limit == null ? "ESPN shows no weekly limit; set how many adds to plan" : `Limit ${a.limit} a week; ESPN didn't say how many you've used`;
  const roster = s.roster.map(p => `<label class="drop"><input type="checkbox" data-drop="${p.id}" ${drops.has(p.id) ? "checked" : ""}>
      <span><b>${esc(p.name)}</b>${p.injury ? ` <span class="inj">${esc(p.injury.replace("_", " "))}</span>` : ""}
      <small>${esc(p.slot || "–")} · ${esc(p.team)} · ${p.starts_left} starts left this week</small></span></label>`).join("");
  const setup = `<section class="card"><h2>Players I'm willing to drop</h2>${roster}
    <div class="acq"><label for="acq"><b>Adds to use</b></label>
      <input id="acq" type="number" inputmode="numeric" min="0" max="20" value="${esc(stream.acq ?? a.left ?? "")}">
      <span class="muted">${acqNote}</span></div>
    ${acqDetails(a, s.week)}
    <button id="plan-btn" ${stream.loading ? "disabled" : ""}>${stream.loading ? "Planning…" : "Plan my pickups"}</button>
    ${stream.error ? `<p class="error">${esc(stream.error)}</p>` : ""}</section>`;
  return `<div class="stack">${setup}</div><div class="stack">${planCard(s)}</div>`;
}

// Shows where the adds-left number came from, so a wrong count can be traced
function acqDetails(a, w) {
  const list = xs => xs.length ? `<ul>${xs.map(m => `<li>${esc(m.date)} · ${esc(m.action)} · ${esc(m.player)}</li>`).join("")}</ul>` : " none";
  const c = a.counter;
  return `<details class="breakdown"><summary>How adds left was counted</summary><ul class="muted">
    <li>Limit from your league settings: <b>${a.daily_limit ? `${a.daily_limit} per day × ${a.limit / a.daily_limit} days = ${a.limit}` : a.limit ?? "not set"}</b></li>
    <li>Matchup days: ${esc(w.start)} to ${esc(w.end)}</li>
    <li>Your adds in those days (from the league activity log):${list(a.counted)}</li>
    <li>Your latest adds, any date:${list(a.recent)}</li>
    <li>ESPN team counter: ${c ? `this week ${c.this_week ?? "missing"}, by week ${esc(JSON.stringify(c.by_week ?? null))}, season ${c.season ?? "missing"}` : "not available"}</li>
    ${a.errors.map(e => `<li class="error">${esc(e)}</li>`).join("")}</ul></details>`;
}

function planCard(s) {
  const head = `<h2>Pickup plan · week ${s.week.number}${s.opponent ? ` vs ${esc(s.opponent)}` : ""}</h2>`;
  if (!s.opponent) return `<section class="card">${head}<p class="muted">Bye week: no matchup to plan for.</p></section>`;
  const p = stream.plan;
  if (!p) return `<section class="card">${head}<p class="muted">Tick the players you'd drop, check the number of adds, then press <b>Plan my pickups</b>.
    The plan tries every top free agent on each of his game days with each player you'd drop, and keeps the moves that win the most categories.</p></section>`;
  const moves = p.moves.length ? `<ol class="moves">${p.moves.map(m => `<li><span class="when">${gameDay(m.day)}</span>
      <span class="add">Add ${esc(m.add.name)}</span> · <span class="dropped">drop ${esc(m.drop.name)}</span>
      <small class="muted">counts ${m.games.length} game${m.games.length === 1 ? "" : "s"} (${m.games.map(gameDay).join(", ")})</small></li>`).join("")}</ol>`
    : '<p class="muted">No pickup improves your projected result with these drops and adds. Try allowing more drops.</p>';
  const rows = CATS9.map(c => `<tr><td>${c}</td><td>${fmt(c, p.before.mine[c])}</td><td class="${p.after.result[c]}">${fmt(c, p.after.mine[c])}</td><td>${fmt(c, p.theirs[c])}</td></tr>`).join("");
  return `<section class="card">${head}
    <p><b>Projected ${p.before.record} → ${p.after.record}</b> (W-L-T)</p>${moves}
    <table><thead><tr><th>Cat</th><th>Now</th><th>With plan</th><th>${esc(s.opponent)}</th></tr></thead><tbody>${rows}</tbody></table>
    <details class="breakdown" open><summary>What makes up these totals</summary>
      <p class="muted">Each total = this week's ESPN totals so far + every counted player's season average × the games he still has (pickups and drops marked).
        FG% and FT% come only from games still to come, because ESPN doesn't give makes and attempts so far.</p>
      ${breakdownTable("You · with plan", p.players, p.current, p.after.mine)}
      ${breakdownTable(s.opponent, p.opp_players, p.opp_current, p.theirs)}
    </details>
    <p class="muted">Free-agent stats are season averages; a pickup only counts on days you have an open starting spot. Adds happen on a player's game day, before tip-off.</p></section>`;
}

// ---- Weekly planner page (#planner) ----
const planner = { roster: "mine", stat: "PTS", teams: new Set(), open: new Set() };

function matchupGamesCard(d) {
  const mine = d.slate.mine, theirs = d.slate.theirs || mine.map(() => 0);
  const total = a => a.reduce((x, y) => x + y, 0), diff = total(mine) - total(theirs);
  const max = Math.max(1, ...mine, ...theirs);
  const rows = weekDays(d).map((dt, i) => `<div class="bar-row">
      <span class="bar-day">${dt.toLocaleDateString(undefined, { weekday: "short" })} ${dt.getDate()}</span>
      <span class="bars"><span class="bar you" style="width:${mine[i] / max * 100}%"></span><span class="bar opp" style="width:${theirs[i] / max * 100}%"></span></span>
      <span class="bar-n">${mine[i]} vs ${theirs[i]}</span></div>`).join("");
  return `<section class="card"><div class="slate-head"><h2>Matchup games · You vs ${esc(d.opponent || "bye")}</h2>${weekPicker(d)}</div>
    <div class="score"><span class="big">${total(mine)}</span><span class="vs">vs</span><span class="big">${total(theirs)}</span>
      <span class="diff ${diff >= 0 ? "pos" : "neg"}">${diff >= 0 ? "+" : ""}${diff} games</span></div>
    ${rows}
    <p class="muted">Starting games per day, same as the weekly slate. Top bar: you. Bottom bar: opponent.</p></section>`;
}

function teamGamesCard(d) {
  const groups = {};
  for (const [team, n] of Object.entries(d.planner.teams || {})) (groups[n] ||= []).push(team);
  // teams where one of your players has at least one start this week
  const mine = new Set(d.planner.mine.filter(r => r.days.includes("start")).map(r => r.team));
  const rows = Object.keys(groups).map(Number).sort((a, b) => b - a).map(n => `<div class="tg-row"><span class="tg-n">${n}</span>
      <span class="tg-teams">${groups[n].sort().map(t => `<button class="chip${mine.has(t) ? " mine" : ""}" data-team="${esc(t)}" aria-pressed="${planner.teams.has(t)}"${mine.has(t) ? ` aria-label="${esc(t)}, you have starters"` : ""}>${esc(t)}</button>`).join("")}</span></div>`).join("");
  return `<section class="card"><div class="slate-head"><h2>Games per team</h2><span class="muted">Click to filter</span></div>
    ${rows || '<p class="muted">No NBA schedule for this week.</p>'}
    ${mine.size ? '<p class="muted">Bold outline: teams where you have a starter this week.</p>' : ""}</section>`;
}

function rosterGuideCard(d) {
  if (!d.planner[planner.roster]) planner.roster = "mine";  // e.g. opponent chosen, then a bye week
  const rows = d.planner[planner.roster];
  const shown = planner.teams.size ? rows.filter(r => planner.teams.has(r.team)) : rows;
  const c = planner.stat;
  const one = v => (Math.round(v * 10) / 10).toFixed(1);
  const stats = (r, i) => r.actual?.[i] || r.avg;  // real stats for past days, season average otherwise
  // one stat from a stat line: counting stats as is; FG%/FT% are makes ÷ attempts
  const show = (t, st) => {
    if (!st.endsWith("%")) return one(t[st] || 0);
    const [m, a] = st === "FG%" ? ["FGM", "FGA"] : ["FTM", "FTA"];
    return t[a] ? pct(`${t[m]}-${t[a]}`) : "—";
  };
  const cell = (r, s, i, st) => s !== "start" ? `<td class="st-${s}">${{ bench: "BE", out: "OUT", dnp: "DNP", off: "·" }[s]}</td>`
    : `<td${r.actual?.[i] ? ' class="real"' : ""}>${show(stats(r, i), st)}</td>`;
  const week = (r, st) => {
    if (r.slot === "IR") return "IR";
    const t = {};
    r.days.forEach((s, i) => { if (s === "start") for (const [k, v] of Object.entries(stats(r, i))) t[k] = (t[k] || 0) + v; });
    return show(t, st);
  };
  const details = r => !planner.open.has(r.id) ? "" : CATS9.map(st => `<tr class="detail"><td></td><th scope="row">${st}</th>
      ${r.days.map((s, i) => cell(r, s, i, st)).join("")}<td class="wk">${week(r, st)}</td></tr>`).join("");
  const days = weekDays(d);
  const head = `<tr><th scope="col">Slot</th><th scope="col">Player</th>${days.map(dt => `<th scope="col">${dt.toLocaleDateString(undefined, { weekday: "short" })}<small>${dt.getDate()}</small></th>`).join("")}<th scope="col">Week ${c}</th></tr>`;
  const body = shown.map(r => `<tr><td>${esc(r.slot || "–")}</td><th scope="row">
        <button class="expand" data-expand="${r.id}" aria-expanded="${planner.open.has(r.id)}">${esc(r.name)} <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.75"/></svg></button>${r.injury ? ` <span class="inj">${esc(r.injury.replace("_", " "))}</span>` : ""}<small>${esc(r.team)}</small></th>
      ${r.days.map((s, i) => cell(r, s, i, c)).join("")}<td class="wk">${week(r, c)}</td></tr>${details(r)}`).join("");
  const opt = (v, label, cur) => `<option value="${v}" ${v === cur ? "selected" : ""}>${label}</option>`;
  return `<section class="card guide"><div class="slate-head"><h2>Roster guide</h2>
      <div class="picker">
        <select id="pl-roster" aria-label="Roster">${opt("mine", "Your team", planner.roster)}${d.planner.theirs ? opt("theirs", esc(d.opponent), planner.roster) : ""}</select>
        <select id="pl-stat" aria-label="Projection stat">${CATS9.map(x => opt(x, x, c)).join("")}</select>
      </div></div>
    <div class="h2h-scroll"><table><thead>${head}</thead><tbody>${body || `<tr><td colspan="${days.length + 3}" class="muted">No players on the selected teams.</td></tr>`}</tbody></table></div>
    <p class="muted">${c} on days a player starts: <b>bold</b> = actual stats from a past day, plain = season average. Week = actual so far + averages for starts left. Click a name for all 9 stats. BE = bench, OUT = injured, DNP = started but no stats, · = no game.${planner.teams.size ? ` Filtered to ${[...planner.teams].join(", ")}.` : ""}</p></section>`;
}

const CATS9 = ["PTS", "REB", "AST", "STL", "BLK", "3PM", "TO", "FG%", "FT%"];

function plannerView(d) {
  return `<div class="stack">${matchupGamesCard(d)}${teamGamesCard(d)}</div>${rosterGuideCard(d)}`;
}

function slateCard(d) {
  const mine = d.slate.mine, theirs = d.slate.theirs || [], nba = d.slate.nba || [];
  const start = new Date(d.week.start + "T00:00"), today = new Date(d.week.today + "T00:00");
  const idx = Math.round((today - start) / 864e5);
  const total = a => a.reduce((x, y) => x + y, 0);
  const diff = total(mine) - total(theirs);
  const date = i => new Date(start.getTime() + i * 864e5);
  const md = dt => dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const days = mine.map((n, i) => `
    <div class="day ${i === idx ? "today" : ""} ${i < idx ? "past" : ""}">
      <div class="d">${date(i).toLocaleDateString(undefined, { weekday: "short" })}</div>
      <div class="dn">${date(i).getDate()}</div>
      <div class="n" title="Your starts">${n}</div>
      ${d.opponent ? `<div class="o" title="Opponent starts">${theirs[i]}</div>` : ""}
      <div class="nba">${nba[i] ?? "–"} NBA</div>
      <div class="st">${i < idx ? "Past" : i === idx ? "Today" : ""}</div>
    </div>`).join("");
  return `<section class="card"><div class="slate-head"><h2>The weekly slate</h2>${weekPicker(d)}</div>
    <div class="score"><span class="big">${total(mine)}</span>
      ${d.opponent ? `<span class="vs">vs</span><span class="big">${total(theirs)}</span>
      <span class="diff ${diff >= 0 ? "pos" : "neg"}">${diff >= 0 ? "+" : ""}${diff} games</span>` : ""}
    </div>
    <p class="meta">${md(date(0))}–${md(new Date(d.week.end + "T00:00"))} · ${d.opponent ? `vs ${esc(d.opponent)}` : "bye week"} · starting games</p>
    <div class="days">${days}</div>
    <p class="legend"><span>Top: you</span>${d.opponent ? "<span>Bottom: opponent</span>" : ""}</p></section>`;
}

// Live category scores from ESPN for the selected week, with who leads each one
function currentCard(d) {
  if (!d.projection || d.week.number !== d.week.current) return "";  // past weeks: the projection card shows the final
  const cur = d.projection.current, res = cur.result;
  const count = r => Object.values(res).filter(x => x === r).length;
  const leader = { W: "You", L: esc(d.opponent), T: "Tied" };
  const rows = d.projection.cats.map(c => `<tr><td>${c}</td><td class="${res[c] === "W" ? "W" : ""}">${fmt(c, cur.mine[c] || 0)}</td>
      <td class="${res[c] === "L" ? "L" : ""}">${fmt(c, cur.theirs[c] || 0)}</td><td class="${res[c]}">${leader[res[c]]}</td></tr>`).join("");
  return `<section class="card"><h2>Current 9-cat score · ${count("W")}-${count("L")}-${count("T")}</h2>
    <table><thead><tr><th>Cat</th><th>You</th><th>${esc(d.opponent)}</th><th>Leading</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="muted">Live totals from ESPN for this matchup. TO: fewer wins.</p></section>`;
}

function projectionCard(d) {
  if (!d.projection) return "";
  const p = d.projection;
  const wins = Object.values(p.result).filter(r => r === "W").length;
  const losses = Object.values(p.result).filter(r => r === "L").length;
  const rows = p.cats.map(c => `<tr><td>${c}</td><td class="${p.result[c]}">${fmt(c, p.mine[c])}</td><td>${fmt(c, p.theirs[c])}</td></tr>`).join("");
  return `<section class="card"><h2>${d.week.number < d.week.current ? "Final" : "Projected"} 9-cat · ${wins}-${losses}-${9 - wins - losses}</h2>
    <table><thead><tr><th>Cat</th><th>You</th><th>${esc(d.opponent)}</th></tr></thead><tbody>${rows}</tbody></table>
    <details class="breakdown"><summary>Per-player breakdown</summary>
      <p class="muted">Starters in your set ESPN lineup: season average × games not started yet, added to this week's totals so far. Bench and IR don't count.</p>
      ${breakdownTable("You", p.players.mine, p.current.mine, p.mine)}
      ${breakdownTable(d.opponent, p.players.theirs, p.current.theirs, p.theirs)}
    </details></section>`;
}

// One row per counted player: their projected stats for the rest of the week.
function breakdownTable(team, players, current, total) {
  const one = v => (Math.round(v * 10) / 10).toString();
  const pctCell = (m, a) => `<td>${a ? pct(`${m}-${a}`) : "—"}<small>${one(m)}-${one(a)}</small></td>`;
  const counting = ["3PM", "PTS", "REB", "AST", "STL", "BLK", "TO"];
  const head = `<tr><th scope="col">Player</th><th scope="col">G</th><th scope="col">FG%</th><th scope="col">FT%</th>${counting.map(c => `<th scope="col">${c}</th>`).join("")}</tr>`;
  const rows = players.map(r => `<tr><th scope="row">${esc(r.name)}</th><td>${r.games}</td>${pctCell(r.FGM, r.FGA)}${pctCell(r.FTM, r.FTA)}${counting.map(c => `<td>${one(r[c])}</td>`).join("")}</tr>`).join("");
  const sofar = `<tr><th scope="row">So far this week</th><td></td><td>${fmt("FG%", current["FG%"] || 0)}</td><td>${fmt("FT%", current["FT%"] || 0)}</td>${counting.map(c => `<td>${one(current[c] || 0)}</td>`).join("")}</tr>`;
  const sum = `<tr class="sum"><th scope="row">Projected</th><td></td><td>${fmt("FG%", total["FG%"])}</td><td>${fmt("FT%", total["FT%"])}</td>${counting.map(c => `<td>${fmt(c, total[c])}</td>`).join("")}</tr>`;
  return `<h3>${esc(team)}</h3><div class="h2h-scroll"><table><thead>${head}</thead><tbody>${rows}${sofar}${sum}</tbody></table></div>`;
}

let week = null;  // selected matchup week; null until the first load tells us the current one
let lastData = null;

function render(d) {
  lastData = d;
  const page = ["#planner", "#streaming"].includes(location.hash) ? location.hash : "#";
  $("#app").classList.toggle("planner", page !== "#");
  document.querySelectorAll(".nav-row a").forEach(a => a.getAttribute("href") === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  $("#app").innerHTML = page === "#planner" ? plannerView(d) : page === "#streaming" ? streamView()
    : rosterCard(d) + `<div class="stack">${slateCard(d)}${currentCard(d)}${projectionCard(d)}</div>`;
}
window.addEventListener("hashchange", () => { closeH2H(); if (lastData) render(lastData); });

async function load(refresh = false) {
  closeH2H();
  if (refresh) Object.assign(stream, { data: null, plan: null });  // streaming page refetches too
  document.querySelectorAll(".picker button, .picker select").forEach(x => x.disabled = true);
  try {
    const q = new URLSearchParams();
    if (week) q.set("week", week);
    if (refresh) q.set("refresh", "true");
    const r = await fetch("/api/dashboard?" + q);
    const d = await r.json().catch(() => ({ detail: `${r.status} ${r.statusText}` }));  // non-JSON error pages
    if (!r.ok) throw new Error(d.detail || r.statusText);
    week = d.week.number;
    $("#team").innerHTML = `${esc(d.team)}<small>${esc(d.league)}</small>`;
    $("#updated").textContent = d.updated ? "Updated " + new Date(d.updated).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
    render(d);
  } catch (e) {
    $("#app").innerHTML = `<p class="error">Could not load league: ${esc(e.message)}</p>`;
  }
}

const H2H_CATS = ["FG%", "FT%", "3PM", "PTS", "REB", "AST", "STL", "BLK", "TO"];
const h2hCache = {};
let h2hChip = null;
const pct = ma => { const [m, a] = ma.split("-").map(Number); return a ? (m / a).toFixed(3).replace(/^0/, "") : "—"; };

function h2hTable(name, d) {
  if (!d.games.length) return `<p class="muted">No games vs ${esc(d.opp)} in the last ${d.seasons} seasons.</p>`;
  const head = H2H_CATS.map(c => `<th scope="col">${c}</th>`).join("");
  const rows = d.games.map(g => `<tr><th scope="row">${esc(g.date)}<small>${esc(g.at)} ${esc(d.opp)} · ${esc(g.result)}</small></th>${
    H2H_CATS.map(c => c.endsWith("%") ? `<td>${pct(g.stats[c])}<small>${esc(g.stats[c])}</small></td>` : `<td>${esc(g.stats[c])}</td>`).join("")}</tr>`).join("");
  return `<div class="h2h-scroll"><table><thead><tr><th scope="col">Game</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function closeH2H() {
  $("#h2h").hidden = true;
  if (h2hChip) { h2hChip.setAttribute("aria-expanded", "false"); h2hChip = null; }
}

async function openH2H(chip) {
  closeH2H();
  h2hChip = chip;
  chip.setAttribute("aria-expanded", "true");
  const pop = $("#h2h"), { h2h: id, opp, name } = chip.dataset, key = id + "/" + opp;
  $("#h2h-title").textContent = `${name}: last 3 games vs ${opp}`;
  $("#h2h-body").innerHTML = `<p class="muted">Loading…</p>`;
  pop.hidden = false;
  const r = chip.getBoundingClientRect();
  pop.style.top = `${r.bottom + scrollY + 6}px`;
  pop.style.left = `${Math.max(16, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 16))}px`;
  try {
    if (!h2hCache[key]) {
      const res = await fetch(`/api/vs/${id}/${encodeURIComponent(opp)}`);
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `${res.status} ${res.statusText}`);
      h2hCache[key] = await res.json();
    }
    if (h2hChip === chip) $("#h2h-body").innerHTML = h2hTable(name, h2hCache[key]);
  } catch (err) {
    if (h2hChip === chip) $("#h2h-body").innerHTML = `<p class="muted">Couldn't load stats: ${esc(err.message)}</p>`;
  }
}

document.addEventListener("click", e => {
  const chip = e.target.closest("[data-h2h]");
  if (chip) return chip === h2hChip ? closeH2H() : openH2H(chip);
  if (!e.target.closest("#h2h")) closeH2H();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && h2hChip) { const c = h2hChip; closeH2H(); c.focus(); }
});

// Clicking anywhere on a player's row toggles their panel; only one panel stays open.
$("#app").addEventListener("click", e => {
  const row = e.target.closest(".player > .row");
  if (!row) return;
  const b = row.querySelector("[data-news]"), open = b.getAttribute("aria-expanded") !== "true";
  document.querySelectorAll("[data-news]").forEach(x => {
    x.setAttribute("aria-expanded", "false");
    $("#news-" + x.dataset.news).classList.remove("open");
  });
  b.setAttribute("aria-expanded", open);
  $("#news-" + b.dataset.news).classList.toggle("open", open);
});
$("#refresh").onclick = () => load(true);
$("#app").addEventListener("input", e => { if (e.target.id === "acq") stream.acq = e.target.value; });
$("#app").addEventListener("click", e => { if (e.target.closest("#plan-btn")) loadStream(true); });
// Week picker: every card reloads for the chosen matchup week
$("#app").addEventListener("click", e => {
  const b = e.target.closest("[data-week]");
  if (b) { week = Number(b.dataset.week); load(); }
});
$("#app").addEventListener("change", e => {
  if (e.target.id === "week") { week = Number(e.target.value); load(); }
  if (e.target.id === "pl-roster") { planner.roster = e.target.value; render(lastData); }
  if (e.target.id === "pl-stat") { planner.stat = e.target.value; render(lastData); }
  if (e.target.dataset.drop) {
    const id = Number(e.target.dataset.drop);
    e.target.checked ? drops.add(id) : drops.delete(id);
    try { localStorage.setItem("drops", JSON.stringify([...drops])); } catch {}
  }
});
// Games-per-team chips filter the roster guide
$("#app").addEventListener("click", e => {
  const x = e.target.closest("[data-expand]");
  if (x) {
    const id = Number(x.dataset.expand);
    planner.open.has(id) ? planner.open.delete(id) : planner.open.add(id);
    render(lastData);
    return document.querySelector(`[data-expand="${id}"]`)?.focus();
  }
  const t = e.target.closest("[data-team]");
  if (!t) return;
  planner.teams.has(t.dataset.team) ? planner.teams.delete(t.dataset.team) : planner.teams.add(t.dataset.team);
  render(lastData);
  document.querySelector(`[data-team="${t.dataset.team}"]`)?.focus();
});
load();
</script>
</body>
</html>
