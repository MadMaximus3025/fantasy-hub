<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Data-Dense Dashboard (ui-ux-pro-max). Light = "Analytics Dashboard" palette, dark = "Financial Dashboard" palette. */
  :root {
    color-scheme: light dark;
    /* color */
    --bg:#f8fafc; --card:#fff; --line:#dbeafe; --text:#1e3a8a; --muted:#475569; --text-2:#334155;
    --accent:#d97706; --on-accent:#000; --accent-line:#b45309; --win:#166534; --loss:#b91c1c;
    --surface-2:#e9eef6; --row-hover:#f1f5fb; --focus:#1e40af;
    /* type */
    --font:"Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num:"Fira Code", ui-monospace, monospace;
    --fs-xs:12px; --fs-sm:12px; --fs-md:14px; --fs-lg:18px; --fs-xl:24px; --lh:1.4;
    /* spacing, size, radius, shadow, motion */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --row-h:36px; --tap:24px;
    --r-sm:4px; --r-md:6px; --r-pill:999px;
    --shadow:0 1px 2px rgb(15 23 42 / .06);
    --dur:150ms;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#020617; --card:#0f172a; --line:#334155; --text:#f8fafc; --muted:#94a3b8; --text-2:#cbd5e1;
      --accent:#f59e0b; --accent-line:#f59e0b; --win:#22c55e; --loss:#f87171;
      --surface-2:#1e293b; --row-hover:#162036; --focus:#fff; --shadow:none;
    }
  }
  @media (pointer: coarse) { :root { --tap:44px; } }
  @media (prefers-reduced-motion: reduce) { :root { --dur:0ms; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:var(--fs-md)/var(--lh) var(--font); font-variant-numeric:tabular-nums; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  header { display:flex; align-items:center; justify-content:space-between; padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--line); margin-bottom:var(--sp-2); }
  header h1 { margin:0; font-size:var(--fs-lg); font-weight:700; }
  header small { color:var(--muted); display:block; font-weight:400; font-size:var(--fs-sm); }
  main { display:grid; grid-template-columns: 1.6fr 1fr; gap:var(--sp-2); padding:0 var(--sp-4) var(--sp-4); }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--sp-3); min-width:0; box-shadow:var(--shadow); }
  .card h2 { margin:0 0 var(--sp-2); font-size:var(--fs-sm); font-weight:600; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; }
  button { display:inline-flex; align-items:center; gap:var(--sp-1); background:var(--accent); color:var(--on-accent); border:0; border-radius:var(--r-pill); padding:0 var(--sp-3); min-height:var(--tap); font:600 var(--fs-sm) var(--font); cursor:pointer; transition:background-color var(--dur), filter var(--dur); }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:hover { filter:brightness(1.08); }
  button.ghost:hover { background:var(--row-hover); filter:none; }
  button svg { width:12px; height:12px; transition:transform var(--dur); }
  button[aria-expanded="true"] svg { transform:rotate(180deg); }
  .player { border-bottom:1px solid var(--line); padding:var(--sp-1); min-height:var(--row-h); transition:background-color var(--dur); }
  .player:hover { background:var(--row-hover); }
  .player > .row { cursor:pointer; }
  .player:last-child { border-bottom:0; }
  .row { display:flex; align-items:center; gap:var(--sp-2); }
  .row img { width:28px; height:28px; border-radius:50%; background:var(--surface-2); object-fit:cover; flex:none; }
  .name { font-weight:600; }
  .meta { color:var(--muted); font-size:var(--fs-xs); letter-spacing:.5px; text-transform:uppercase; }
  .tag { margin-left:auto; display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .inj { color:var(--loss); font-weight:700; font-size:var(--fs-sm); }
  .gl { color:var(--muted); font:var(--fs-sm) var(--font-num); white-space:nowrap; }
  .news { margin:var(--sp-1) 0 var(--sp-1) 36px; display:none; }
  .news.open { display:block; }
  .news p { margin:var(--sp-1) 0; color:var(--text-2); }
  .news b { color:var(--text); }
  .games { list-style:none; margin:var(--sp-1) 0; padding:0; display:flex; flex-wrap:wrap; gap:var(--sp-1); }
  .games li { font-size:var(--fs-sm); color:var(--text-2); }
  .chip { background:transparent; color:var(--text-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:0 var(--sp-2); font-weight:500; }
  .chip:hover, .chip[aria-expanded="true"] { background:var(--row-hover); border-color:var(--focus); filter:none; }
  .h2h { position:absolute; z-index:10; width:min(560px, calc(100vw - 32px)); background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:0 8px 24px rgb(0 0 0 / .25); padding:var(--sp-3); }
  .h2h-head { display:flex; justify-content:space-between; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-2); }
  .h2h-scroll { overflow-x:auto; }
  .breakdown { margin-top:var(--sp-3); }
  .breakdown summary { cursor:pointer; font-weight:600; min-height:var(--tap); display:flex; align-items:center; }
  .breakdown h3 { margin:var(--sp-3) 0 var(--sp-1); font-size:var(--fs-sm); color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .breakdown th, .breakdown td { white-space:nowrap; }
  .breakdown tr.sum td, .breakdown tr.sum th { font-weight:700; border-top:2px solid var(--line); }
  .h2h th, .h2h td { white-space:nowrap; }
  .h2h small, .breakdown small { display:block; color:var(--muted); font:var(--fs-xs) var(--font); }
  .muted { color:var(--muted); margin:0; }
  .games span { font-family:var(--font-num); color:var(--muted); margin-right:var(--sp-1); }
  .score { display:flex; align-items:baseline; gap:var(--sp-2); margin-bottom:var(--sp-2); flex-wrap:wrap; }
  .score .big { font:700 var(--fs-xl) var(--font-num); }
  .score .vs { color:var(--muted); }
  .diff { font:600 var(--fs-md) var(--font-num); }
  .diff.pos { color:var(--win); } .diff.neg { color:var(--loss); }
  .days { display:grid; grid-template-columns:repeat(7,1fr); gap:var(--sp-1); }
  .day { border:1px solid var(--line); border-radius:var(--r-sm); text-align:center; padding:var(--sp-1) 0; }
  .day.today { border:2px solid var(--accent-line); }
  .day.past { background:var(--surface-2); }
  .day.past .n { color:var(--muted); }
  .day .d { font-size:var(--fs-sm); color:var(--muted); font-weight:600; }
  .day .n { font:700 var(--fs-lg) var(--font-num); }
  .day .o { font-size:var(--fs-xs); color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  th, td { height:var(--row-h); padding:0 var(--sp-2); text-align:right; border-bottom:1px solid var(--line); }
  td { font-family:var(--font-num); }
  tbody tr { transition:background-color var(--dur); }
  tbody tr:hover { background:var(--row-hover); }
  th:first-child, td:first-child { text-align:left; font-family:var(--font); }
  th { color:var(--muted); font-size:var(--fs-sm); font-weight:600; }
  td.W { color:var(--win); font-weight:700; } td.L { color:var(--loss); font-weight:700; } td.T { color:var(--muted); }
  .stack { display:grid; gap:var(--sp-2); align-content:start; min-width:0; }
  .error { color:var(--loss); padding:var(--sp-4); }
</style>
</head>
<body>
<header>
  <h1 id="team">Loading…<small id="league"></small></h1>
  <button id="refresh" class="ghost">Refresh</button>
</header>
<main id="app"></main>
<div id="h2h" class="h2h" role="dialog" aria-labelledby="h2h-title" hidden>
  <div class="h2h-head"><strong id="h2h-title"></strong><button class="ghost" type="button" aria-label="Close" onclick="closeH2H()"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.75"/></svg></button></div>
  <div id="h2h-body"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (c, v) => c.endsWith("%") ? Number(v).toFixed(3).replace(/^0/, "") : Math.round(v);
const headshot = id => `https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;

const gameDay = iso => new Date(iso + "T00:00").toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" });

function rosterCard(d) {
  const rows = d.roster.map((p, i) => `
    <div class="player">
      <div class="row">
        <img src="${headshot(p.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.pos)} · ${esc(p.team)}</div></div>
        <div class="tag">
          ${p.injury ? `<span class="inj">${esc(p.injury.replace("_", " "))}</span>` : ""}
          <span class="gl">${p.games_left} G left</span>
          <button data-news="${i}" aria-expanded="false" aria-controls="news-${i}">Games${p.news.length ? ` · ${p.news.length} news` : ""} <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.75"/></svg></button>
        </div>
      </div>
      <div class="news" id="news-${i}">
        <ul class="games" aria-label="Games left this matchup">${p.upcoming.length
          ? p.upcoming.map(g => `<li><button class="chip" data-h2h="${p.id}" data-opp="${esc(g.opp)}" data-name="${esc(p.name)}" aria-haspopup="dialog" aria-expanded="false"><span>${gameDay(g.date)}</span> vs ${esc(g.opp)}</button></li>`).join("")
          : "<li>No games left this matchup</li>"}</ul>
        ${p.news.map(n => `<p><b>${esc(n.headline)}</b><br>${esc(n.tldr)}</p>`).join("")}
      </div>
    </div>`).join("");
  return `<section class="card"><h2>Roster · ${d.roster.length} players</h2>${rows}</section>`;
}

function slateCard(d) {
  const mine = d.slate.mine, theirs = d.slate.theirs || [];
  const start = new Date(d.week.start + "T00:00"), today = new Date(d.week.today + "T00:00");
  const idx = Math.round((today - start) / 864e5);
  const left = a => a.slice(idx).reduce((x, y) => x + y, 0);
  const diff = left(mine) - left(theirs);
  const days = mine.map((n, i) => `
    <div class="day ${i === idx ? "today" : ""} ${i < idx ? "past" : ""}">
      <div class="d">${"MTWTFSS"[i]}</div><div class="n">${n}</div>
      ${d.opponent ? `<div class="o">vs ${theirs[i]}</div>` : ""}
    </div>`).join("");
  return `<section class="card"><h2>The weekly slate</h2>
    <div class="score"><span class="big">${left(mine)}</span>
      ${d.opponent ? `<span class="vs">vs</span><span class="big">${left(theirs)}</span>
      <span class="meta">games left · vs ${esc(d.opponent)}</span>
      <span class="diff ${diff >= 0 ? "pos" : "neg"}">${diff >= 0 ? "+" : ""}${diff} games</span>` : `<span class="meta">games left · bye week</span>`}
    </div>
    <div class="days">${days}</div></section>`;
}

function projectionCard(d) {
  if (!d.projection) return "";
  const p = d.projection;
  const wins = Object.values(p.result).filter(r => r === "W").length;
  const losses = Object.values(p.result).filter(r => r === "L").length;
  const rows = p.cats.map(c => `<tr><td>${c}</td><td class="${p.result[c]}">${fmt(c, p.mine[c])}</td><td>${fmt(c, p.theirs[c])}</td></tr>`).join("");
  return `<section class="card"><h2>Projected 9-cat · ${wins}-${losses}-${9 - wins - losses}</h2>
    <table><thead><tr><th>Cat</th><th>You</th><th>${esc(d.opponent)}</th></tr></thead><tbody>${rows}</tbody></table>
    <details class="breakdown"><summary>Per-player breakdown</summary>
      <p class="muted">Season average × games left (not started yet), added to this week's totals so far.</p>
      ${breakdownTable("You", p.players.mine, p.current.mine, p.mine)}
      ${breakdownTable(d.opponent, p.players.theirs, p.current.theirs, p.theirs)}
    </details></section>`;
}

// One row per counted player: their projected stats for the rest of the week.
function breakdownTable(team, players, current, total) {
  const one = v => (Math.round(v * 10) / 10).toString();
  const pctCell = (m, a) => `<td>${a ? pct(`${m}-${a}`) : "—"}<small>${one(m)}-${one(a)}</small></td>`;
  const counting = ["3PM", "PTS", "REB", "AST", "STL", "BLK", "TO"];
  const head = `<tr><th scope="col">Player</th><th scope="col">G</th><th scope="col">FG%</th><th scope="col">FT%</th>${counting.map(c => `<th scope="col">${c}</th>`).join("")}</tr>`;
  const rows = players.map(r => `<tr><th scope="row">${esc(r.name)}</th><td>${r.games}</td>${pctCell(r.FGM, r.FGA)}${pctCell(r.FTM, r.FTA)}${counting.map(c => `<td>${one(r[c])}</td>`).join("")}</tr>`).join("");
  const sofar = `<tr><th scope="row">So far this week</th><td></td><td>${fmt("FG%", current["FG%"] || 0)}</td><td>${fmt("FT%", current["FT%"] || 0)}</td>${counting.map(c => `<td>${one(current[c] || 0)}</td>`).join("")}</tr>`;
  const sum = `<tr class="sum"><th scope="row">Projected</th><td></td><td>${fmt("FG%", total["FG%"])}</td><td>${fmt("FT%", total["FT%"])}</td>${counting.map(c => `<td>${fmt(c, total[c])}</td>`).join("")}</tr>`;
  return `<h3>${esc(team)}</h3><div class="h2h-scroll"><table><thead>${head}</thead><tbody>${rows}${sofar}${sum}</tbody></table></div>`;
}

async function load(refresh = false) {
  try {
    const r = await fetch("/api/dashboard" + (refresh ? "?refresh=true" : ""));
    const d = await r.json().catch(() => ({ detail: `${r.status} ${r.statusText}` }));  // non-JSON error pages
    if (!r.ok) throw new Error(d.detail || r.statusText);
    $("#team").innerHTML = `${esc(d.team)}<small>${esc(d.league)}</small>`;
    $("#app").innerHTML = rosterCard(d) + `<div class="stack">${slateCard(d)}${projectionCard(d)}</div>`;
  } catch (e) {
    $("#app").innerHTML = `<p class="error">Could not load league: ${esc(e.message)}</p>`;
  }
}

const H2H_CATS = ["FG%", "FT%", "3PM", "PTS", "REB", "AST", "STL", "BLK", "TO"];
const h2hCache = {};
let h2hChip = null;
const pct = ma => { const [m, a] = ma.split("-").map(Number); return a ? (m / a).toFixed(3).replace(/^0/, "") : "—"; };

function h2hTable(name, d) {
  if (!d.games.length) return `<p class="muted">No games vs ${esc(d.opp)} in the last ${d.seasons} seasons.</p>`;
  const head = H2H_CATS.map(c => `<th scope="col">${c}</th>`).join("");
  const rows = d.games.map(g => `<tr><th scope="row">${esc(g.date)}<small>${esc(g.at)} ${esc(d.opp)} · ${esc(g.result)}</small></th>${
    H2H_CATS.map(c => c.endsWith("%") ? `<td>${pct(g.stats[c])}<small>${esc(g.stats[c])}</small></td>` : `<td>${esc(g.stats[c])}</td>`).join("")}</tr>`).join("");
  return `<div class="h2h-scroll"><table><thead><tr><th scope="col">Game</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function closeH2H() {
  $("#h2h").hidden = true;
  if (h2hChip) { h2hChip.setAttribute("aria-expanded", "false"); h2hChip = null; }
}

async function openH2H(chip) {
  closeH2H();
  h2hChip = chip;
  chip.setAttribute("aria-expanded", "true");
  const pop = $("#h2h"), { h2h: id, opp, name } = chip.dataset, key = id + "/" + opp;
  $("#h2h-title").textContent = `${name}: last 3 games vs ${opp}`;
  $("#h2h-body").innerHTML = `<p class="muted">Loading…</p>`;
  pop.hidden = false;
  const r = chip.getBoundingClientRect();
  pop.style.top = `${r.bottom + scrollY + 6}px`;
  pop.style.left = `${Math.max(16, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 16))}px`;
  try {
    if (!h2hCache[key]) {
      const res = await fetch(`/api/vs/${id}/${encodeURIComponent(opp)}`);
      if (!res.ok) throw new Error();
      h2hCache[key] = await res.json();
    }
    if (h2hChip === chip) $("#h2h-body").innerHTML = h2hTable(name, h2hCache[key]);
  } catch {
    if (h2hChip === chip) $("#h2h-body").innerHTML = `<p class="muted">Couldn't load stats. Try again.</p>`;
  }
}

document.addEventListener("click", e => {
  const chip = e.target.closest("[data-h2h]");
  if (chip) return chip === h2hChip ? closeH2H() : openH2H(chip);
  if (!e.target.closest("#h2h")) closeH2H();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && h2hChip) { const c = h2hChip; closeH2H(); c.focus(); }
});

// Clicking anywhere on a player's row toggles their panel; only one panel stays open.
$("#app").addEventListener("click", e => {
  const row = e.target.closest(".player > .row");
  if (!row) return;
  const b = row.querySelector("[data-news]"), open = b.getAttribute("aria-expanded") !== "true";
  document.querySelectorAll("[data-news]").forEach(x => {
    x.setAttribute("aria-expanded", "false");
    $("#news-" + x.dataset.news).classList.remove("open");
  });
  b.setAttribute("aria-expanded", open);
  $("#news-" + b.dataset.news).classList.toggle("open", open);
});
$("#refresh").onclick = () => load(true);
load();
</script>
</body>
</html>
