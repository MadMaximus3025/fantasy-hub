<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Dark data dashboard (ui-ux-pro-max Data-Dense style), dark only. You = blue, opponent = orange; winning = green fill. */
  :root {
    color-scheme: dark;
    /* color */
    --bg:#000; --card:#0d0d10; --card-2:#09090b; --line:#26262c; --text:#f4f4f5; --muted:#a1a1aa; --text-2:#d4d4d8;
    --accent:#f59e0b; --on-accent:#111; --accent-line:#f59e0b; --win:#34d399; --loss:#fb7185;
    --win-bg:rgb(52 211 153 / .16); --loss-bg:rgb(251 113 133 / .10);
    --you:#60a5fa; --opp:#fb923c;
    --surface-2:#18181c; --row-hover:#141418; --focus:#fff;
    /* type */
    --font:"Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num:"Fira Code", ui-monospace, monospace;
    --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-lg:18px; --fs-xl:28px; --lh:1.4;
    /* spacing, size, radius, shadow, motion */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --row-h:36px; --tap:28px;
    --r-sm:8px; --r-md:14px; --r-pill:999px;
    --shadow:0 10px 30px rgb(0 0 0 / .35);
    --dur:150ms;
  }
  @media (pointer: coarse) { :root { --tap:44px; } }
  @media (prefers-reduced-motion: reduce) { :root { --dur:0ms; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:var(--fs-md)/var(--lh) var(--font); font-variant-numeric:tabular-nums; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); flex-wrap:wrap; padding:var(--sp-4); margin-bottom:var(--sp-2); }
  header h1 { margin:0; font-size:var(--fs-lg); font-weight:700; }
  header small { color:var(--muted); display:block; font-weight:400; font-size:var(--fs-sm); }
  .refresh { display:flex; flex-direction:column; align-items:flex-end; gap:var(--sp-1); }
  main { display:grid; grid-template-columns: 1.6fr 1fr; gap:var(--sp-2); padding:0 var(--sp-4) var(--sp-4); }
  main.planner { grid-template-columns: 1fr 1.8fr; }
  .wide { grid-column:1 / -1; }
  .mc-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:var(--sp-4); }
  .mc-side { border-left:1px solid var(--line); padding-left:var(--sp-4); }
  @media (max-width: 900px) { .mc-grid { grid-template-columns:1fr; } .mc-side { border-left:0; padding-left:0; border-top:1px solid var(--line); padding-top:var(--sp-3); } }
  .mc-big { display:flex; align-items:baseline; gap:var(--sp-3); }
  .mc-big .num { font:800 64px/1 var(--font-num); }
  .mc-big span:last-child { font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.5px; font-size:var(--fs-sm); }
  .mc-sub { color:var(--text-2); }
  .pos { color:var(--win); } .neg { color:var(--loss); }
  .mc-labels, .mc-row { display:grid; grid-template-columns:5.5em 1fr 5.5em 3.5em; align-items:center; gap:var(--sp-2); }
  .mc-labels { font:700 var(--fs-xs) var(--font); color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:var(--sp-3); }
  .mc-labels span:first-child { text-align:right; } .mc-labels span:last-child { text-align:right; }
  .mc-labels span:nth-child(3) { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  a { color:var(--you); }
  .mc-row { padding:5px 0; border-bottom:1px solid var(--line); }
  .mc-v { font:600 var(--fs-md) var(--font-num); } .mc-v.you { text-align:right; }
  .mc-labels .mc-key { text-align:center; text-transform:none; letter-spacing:0; font-weight:400; }
  .mc-v small { display:block; font:var(--fs-xs) var(--font); color:var(--muted); }
  .mc-bar { position:relative; height:26px; }
  .mc-bar::before { content:""; position:absolute; left:0; right:0; top:50%; border-top:1px solid var(--line); }
  .mc-fill { position:absolute; top:5px; height:10px; border-radius:5px; }
  .mc-fill.you { background:var(--you); } .mc-fill.opp { background:var(--opp); }
  .mc-proj { position:absolute; top:18px; height:3px; border-radius:2px; opacity:.45; }
  .mc-proj.you { background:var(--you); } .mc-proj.opp { background:var(--opp); }
  .mc-cat { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); font:700 var(--fs-xs) var(--font); background:var(--card); border:1px solid var(--line); border-radius:var(--r-pill); padding:1px 8px; }
  .mc-p { font:700 var(--fs-sm) var(--font-num); text-align:right; } .mc-p.mid { color:var(--accent); }
  .tiles3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--sp-2); margin-bottom:var(--sp-3); }
  .tiles3 .tile span { display:block; font:700 var(--fs-xs) var(--font); color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .tiles3 .tile b { display:block; font:800 var(--fs-xl) var(--font-num); }
  .tiles3 .tile small { color:var(--muted); }
  .mc-side h3 { font:700 var(--fs-xs) var(--font); color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:var(--sp-3) 0 var(--sp-2); }
  .mc-side h3 small { text-transform:none; letter-spacing:0; font-weight:400; margin-left:var(--sp-2); }
  .who-grid { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); }
  .who h3 { margin-top:0; }
  .who-row { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:var(--sp-2); padding:var(--sp-1) 0; }
  .who-row small { display:block; color:var(--muted); }
  .switch { min-width:4.5em; justify-content:center; }
  .switch[aria-checked="false"] { background:var(--surface-2); color:var(--text-2); border:1px solid var(--line); }
  .nn-row { display:grid; grid-template-columns:4.5em 1fr 3.5em 2em; align-items:center; gap:var(--sp-2); padding:3px 0; font-size:var(--fs-sm); }
  .nn-row.past { opacity:.75; } .nn-row.today .nn-day { font-weight:800; color:var(--text); }
  .nn-day { color:var(--muted); }
  .nn-bars { display:grid; gap:2px; }
  .nn-bars .bar { display:block; height:6px; border-radius:3px; } .nn-bars .bar.you { background:var(--you); } .nn-bars .bar.opp { background:var(--opp); }
  .nn-n { font-family:var(--font-num); text-align:right; } .nn-d { font:700 var(--fs-sm) var(--font-num); text-align:right; }
  @media (max-width: 900px) { main, main.planner { grid-template-columns:1fr; } }
  .nav-row { display:flex; gap:var(--sp-2); }
  .nav-row { flex-wrap:wrap; justify-content:flex-end; }
  .nav-row a.button:not([aria-current]) { background:transparent; color:var(--text); border:1px solid var(--line); }
  .drop .switch { margin-left:auto; min-width:6.5em; }
  .switch[aria-checked="true"][data-drop] { background:var(--loss); color:#111; }
  .rd-wrap { display:grid; grid-template-columns:minmax(280px, 400px) 1fr; gap:var(--sp-3); align-items:center; }
  @media (max-width: 700px) { .rd-wrap { grid-template-columns:1fr; } }
  .radar { width:100%; height:auto; }
  .rd-ring { fill:none; stroke:var(--line); }
  .rd-b { fill:none; stroke:var(--text); stroke-width:1.5; }
  .rd-a-fill { fill:rgb(245 158 11 / .35); stroke:var(--accent); stroke-width:2.5; }
  .rd-a-dot { fill:var(--accent); } .rd-b-dot { fill:var(--card); stroke:var(--text); stroke-width:1.5; }
  .rd-cat { fill:var(--text-2); font:700 11px var(--font); }
  .rd-val { fill:var(--muted); font:11px var(--font-num); } .rd-a { fill:var(--accent); color:var(--accent); font-weight:700; }
  .rd-head { display:flex; justify-content:space-between; font:700 var(--fs-xs) var(--font); color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .rd-who { display:grid; grid-template-columns:auto auto 1fr auto; align-items:center; gap:var(--sp-2); padding:var(--sp-2) 0; border-bottom:1px solid var(--line); }
  .rd-who small { display:block; color:var(--muted); }
  .sw { width:14px; height:14px; border-radius:3px; border:2px solid var(--text); }
  .sw.a { background:var(--accent); border-color:var(--accent); }
  .drop { display:flex; align-items:center; gap:var(--sp-2); min-height:var(--tap); border-bottom:1px solid var(--line); cursor:pointer; }
  .drop input { width:18px; height:18px; accent-color:var(--focus); flex:none; }
  .drop small { display:block; color:var(--muted); }
  .acq { display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2); margin:var(--sp-3) 0; }
  .acq input { width:4.5em; min-height:var(--tap); border:1px solid var(--line); border-radius:var(--r-sm); background:var(--card); color:var(--text); font:600 var(--fs-md) var(--font-num); padding:0 var(--sp-2); }
  .moves { list-style:none; padding:0; margin:0; }
  .moves .when { font-family:var(--font-num); color:var(--muted); margin-right:var(--sp-2); }
  .moves .why { display:block; color:var(--text-2); font-size:var(--fs-sm); }
  .moves .add { color:var(--win); font-weight:700; } .moves .dropped { color:var(--loss); font-weight:700; }
  a.button { display:inline-flex; align-items:center; min-height:var(--tap); padding:0 var(--sp-3); border-radius:var(--r-pill); background:var(--accent); color:var(--on-accent); font:600 var(--fs-sm) var(--font); text-decoration:none; }
  .bar-row { display:grid; grid-template-columns: 4.5em 1fr auto; align-items:center; gap:var(--sp-2); padding:var(--sp-1) 0; font-size:var(--fs-sm); }
  .bar-day { color:var(--muted); font-weight:600; }
  .bars { display:grid; gap:2px; background:var(--surface-2); border-radius:var(--r-sm); padding:2px; }
  .bar { display:block; height:6px; border-radius:3px; }
  .bar.you { background:var(--focus); } .bar.opp { background:var(--loss); }
  .bar-n { font-family:var(--font-num); white-space:nowrap; }
  .gl-head { display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-3); }
  .gl-head .big { font:800 var(--fs-xl) var(--font-num); } .gl-head .big.you { color:var(--you); } .gl-head .big.opp { color:var(--opp); }
  .gl-head small { color:var(--muted); line-height:1.1; }
  .gl-head .status { margin-left:auto; font:800 var(--fs-sm) var(--font); text-transform:uppercase; letter-spacing:.5px; }
  .status.pos, .guide .pos { color:var(--win); } .status.neg, .guide .neg { color:var(--loss); }
  .cat-bar { display:grid; grid-template-columns:3.2em 1fr 8.5em; align-items:center; gap:var(--sp-2); padding:3px 0; font-size:var(--fs-sm); }
  .cb-cat { font-weight:700; color:var(--text-2); }
  .cat-bar.W .cb-cat { color:var(--win); } .cat-bar.L .cb-cat { color:var(--loss); }
  .cb-bars { display:grid; gap:3px; }
  .cb-bars .bar { height:7px; border-radius:4px; opacity:.45; }
  .cb-bars .bar.lead { opacity:1; }
  .cb-bars .bar.you { background:var(--you); } .cb-bars .bar.opp { background:var(--opp); }
  .chip.day { padding:0 var(--sp-3); }
  .cb-n { font-family:var(--font-num); text-align:right; white-space:nowrap; color:var(--text-2); }
  .day-chips { display:flex; flex-wrap:wrap; gap:var(--sp-1); margin-bottom:var(--sp-2); }
  .chip.day[aria-pressed="true"] { background:var(--you); color:#0b1020; border-color:var(--you); }
  .guide th.today, .guide td.today { background:rgb(96 165 250 / .10); }
  .guide td.imp { font-weight:600; }
  .panel-row > td { padding:var(--sp-3) var(--sp-2) var(--sp-4); background:var(--card-2); text-align:left !important; white-space:normal !important; }
  .pp { border:1px solid var(--line); border-radius:var(--r-md); padding:var(--sp-3); background:var(--card); }
  .pp-sum { margin:0 0 var(--sp-3); font-weight:700; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:var(--sp-2); margin-bottom:var(--sp-3); }
  .tile { border:1px solid var(--line); border-radius:var(--r-sm); padding:var(--sp-2) var(--sp-3); background:var(--card-2); }
  .tile.close { border:2px solid var(--accent); }
  .t-top { display:flex; justify-content:space-between; font:700 var(--fs-xs) var(--font); letter-spacing:.5px; color:var(--text-2); }
  .t-status { text-transform:uppercase; }
  .tile.ahead .t-status { color:var(--win); } .tile.behind .t-status { color:var(--loss); } .tile.close .t-status { color:var(--accent); }
  .t-val { font:800 var(--fs-xl) var(--font-num); margin:2px 0; }
  .t-imp { font-size:var(--fs-sm); color:var(--muted); }
  .t-imp .pos, .g-imp .pos { color:var(--win); } .t-imp .neg, .g-imp .neg { color:var(--loss); }
  .games { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:var(--sp-2); }
  .game { border:1px solid var(--line); border-radius:var(--r-sm); padding:var(--sp-2) var(--sp-3); }
  .g-top { display:flex; justify-content:space-between; gap:var(--sp-2); font:700 var(--fs-xs) var(--font); text-transform:uppercase; letter-spacing:.5px; color:var(--text-2); }
  .g-top span { color:var(--muted); }
  .g-imp { margin:var(--sp-1) 0; font-size:var(--fs-sm); color:var(--muted); }
  .g-imp b { font:800 var(--fs-lg) var(--font-num); }
  .g-line { font-size:var(--fs-sm); color:var(--text-2); } .g-line b { font-family:var(--font-num); color:var(--text); }
  .guide td.imp.pos { color:var(--win); } .guide td.imp.neg { color:var(--loss); }
  .tg-row { display:flex; gap:var(--sp-3); align-items:flex-start; padding:var(--sp-2) 0; border-top:1px solid var(--line); }
  .tg-n { font:700 var(--fs-lg) var(--font-num); min-width:1.5em; }
  .tg-teams { display:flex; flex-wrap:wrap; gap:var(--sp-1); }
  .chip.mine { border:2px solid var(--focus); color:var(--text); font-weight:700; }
  .chip[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .guide th small, .guide td small { display:block; color:var(--muted); font:var(--fs-xs) var(--font); }
  .guide th, .guide td { white-space:nowrap; text-align:center; }
  .guide tbody th, .guide thead th:nth-child(2) { text-align:left; }
  .guide tbody th .pic { vertical-align:middle; margin-right:var(--sp-2); }
  .guide td[class^="st-"] { color:var(--muted); }
  .guide td.st-out { color:var(--loss); }
  .guide .wk { font-weight:700; background:var(--surface-2); }
  .guide td.real { font-weight:700; color:var(--text); }
  .guide .expand { background:none; border:0; padding:0; min-height:var(--tap); color:var(--text); font:600 var(--fs-md) var(--font); filter:none; }
  .guide .expand:hover { text-decoration:underline; }
  .guide tr.detail th, .guide tr.detail td { font-size:var(--fs-sm); background:var(--row-hover); }
  .guide tr.detail th { color:var(--muted); padding-left:var(--sp-4); }
  .card { background:linear-gradient(180deg, var(--card), var(--card-2)); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--sp-4); min-width:0; box-shadow:var(--shadow); }
  .card h2 { margin:0 0 var(--sp-2); font-size:var(--fs-sm); font-weight:600; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; }
  button { display:inline-flex; align-items:center; gap:var(--sp-1); background:var(--accent); color:var(--on-accent); border:0; border-radius:var(--r-pill); padding:0 var(--sp-3); min-height:var(--tap); font:600 var(--fs-sm) var(--font); cursor:pointer; transition:background-color var(--dur), filter var(--dur); }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:hover { filter:brightness(1.08); }
  button.ghost:hover { background:var(--row-hover); filter:none; }
  button svg { width:12px; height:12px; transition:transform var(--dur); }
  button[aria-expanded="true"] svg { transform:rotate(180deg); }
  .player { border-bottom:1px solid var(--line); padding:var(--sp-1); min-height:var(--row-h); transition:background-color var(--dur); }
  .player:hover { background:var(--row-hover); }
  .player > .row { cursor:pointer; }
  .player:last-child { border-bottom:0; }
  .row { display:flex; align-items:center; gap:var(--sp-2); }
  .row img, .pic { width:44px; height:44px; border-radius:50%; background:var(--surface-2); object-fit:cover; object-position:top; flex:none; border:2px solid var(--line); }
  .pic.sm { width:34px; height:34px; }
  .pic.lg { width:64px; height:64px; }
  /* versus rows: left value | category | right value; the winning side is filled */
  .vs { display:grid; gap:4px; margin:var(--sp-2) 0; }
  .vs-head { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-2); }
  .vs-side { display:flex; align-items:center; gap:var(--sp-2); min-width:0; }
  .vs-side.right { flex-direction:row-reverse; text-align:right; }
  .vs-side b { display:block; overflow:hidden; text-overflow:ellipsis; }
  .vs-side small { color:var(--muted); display:block; }
  .vs-side.left b { color:var(--you); } .vs-side.right b { color:var(--opp); }
  .vs-badge { font:800 var(--fs-sm) var(--font); color:var(--muted); padding:var(--sp-1) var(--sp-2); border:1px solid var(--line); border-radius:var(--r-pill); }
  .vs-row { display:grid; grid-template-columns:1fr 4.2em 1fr; align-items:stretch; gap:4px; }
  .vs-val { font:600 var(--fs-md) var(--font-num); padding:6px var(--sp-3); border-radius:var(--r-sm); background:var(--surface-2); border:1px solid transparent; }
  .vs-val.left { text-align:right; } .vs-val.right { text-align:left; }
  .vs-val small { display:block; font:var(--fs-xs) var(--font); color:var(--muted); }
  .vs-val.win { background:var(--win-bg); border-color:var(--win); color:var(--win); font-weight:800; }
  .vs-val.left.win { box-shadow:inset 4px 0 0 var(--win); } .vs-val.right.win { box-shadow:inset -4px 0 0 var(--win); }
  .vs-val.lose { color:var(--loss); background:var(--loss-bg); }
  .vs-cat { display:grid; place-items:center; font:700 var(--fs-xs) var(--font); letter-spacing:.5px; color:var(--text-2); background:var(--card); border:1px solid var(--line); border-radius:var(--r-pill); }
  .vs-score { display:flex; justify-content:center; align-items:baseline; gap:var(--sp-3); font:800 var(--fs-xl) var(--font-num); }
  .vs-score .you { color:var(--you); } .vs-score .opp { color:var(--opp); } .vs-score small { font:600 var(--fs-sm) var(--font); color:var(--muted); }
  @media (max-width: 560px) {
    .vs-side, .vs-side.right { flex-direction:column; text-align:center; }
    .pic.lg { width:52px; height:52px; }
  }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .move { border:1px solid var(--line); border-radius:var(--r-md); padding:var(--sp-3); margin:var(--sp-3) 0; background:rgb(255 255 255 / .02); }
  .adj { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); margin:0 0 var(--sp-2); font-size:var(--fs-sm); color:var(--text-2); }
  .adj span:last-child { text-align:right; }
  .move .meta-line { display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2); color:var(--muted); font-size:var(--fs-sm); margin:var(--sp-1) 0 var(--sp-2); }
  .move .kind { font:800 var(--fs-xs) var(--font); letter-spacing:.5px; text-transform:uppercase; padding:2px var(--sp-2); border-radius:var(--r-pill); background:var(--accent); color:var(--on-accent); }
  .move .kind.upgrade { background:var(--you); }
  .name { font-weight:600; }
  .meta { color:var(--muted); font-size:var(--fs-xs); letter-spacing:.5px; text-transform:uppercase; }
  .tag { margin-left:auto; display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .inj { color:var(--loss); font-weight:700; font-size:var(--fs-sm); }
  .gl { color:var(--muted); font:var(--fs-sm) var(--font-num); white-space:nowrap; }
  .news { margin:var(--sp-1) 0 var(--sp-1) 36px; display:none; }
  .news.open { display:block; }
  .news p { margin:var(--sp-1) 0; color:var(--text-2); }
  .news b { color:var(--text); }
  .live { margin:var(--sp-2) 0; }
  .live-today { border:1px solid var(--line); border-radius:var(--r-sm); padding:var(--sp-2) var(--sp-3); margin-bottom:var(--sp-2); background:var(--card-2); }
  .lt-head { display:flex; justify-content:space-between; gap:var(--sp-2); }
  .lt-status { font:700 var(--fs-xs) var(--font); text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .lt-status.in { color:var(--win); }
  .stat-line { display:flex; flex-wrap:wrap; gap:var(--sp-1) var(--sp-3); margin:var(--sp-1) 0; font-size:var(--fs-sm); color:var(--text-2); }
  .stat-line b { font:700 var(--fs-md) var(--font-num); color:var(--text); }
  .last3 caption { text-align:left; font:700 var(--fs-xs) var(--font); color:var(--muted); text-transform:uppercase; letter-spacing:.5px; padding:var(--sp-1) 0; }
  .last3 th small, .last3 td small { display:block; color:var(--muted); font:var(--fs-xs) var(--font); }
  .pend { font:700 var(--fs-xs) var(--font); color:var(--accent); border:1px solid var(--accent); border-radius:var(--r-pill); padding:1px 8px; white-space:nowrap; }
  .news .tag { font-size:var(--fs-xs); font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--loss); }
  .games { list-style:none; margin:var(--sp-1) 0; padding:0; display:flex; flex-wrap:wrap; gap:var(--sp-1); }
  .games li { font-size:var(--fs-sm); color:var(--text-2); }
  .chip { background:transparent; color:var(--text-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:0 var(--sp-2); font-weight:500; }
  .chip:hover, .chip[aria-expanded="true"] { background:var(--row-hover); border-color:var(--focus); filter:none; }
  .h2h { position:absolute; z-index:10; width:min(560px, calc(100vw - 32px)); background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:0 8px 24px rgb(0 0 0 / .25); padding:var(--sp-3); }
  .h2h-head { display:flex; justify-content:space-between; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-2); }
  .h2h-scroll { overflow-x:auto; }
  .breakdown { margin-top:var(--sp-3); }
  .breakdown summary { cursor:pointer; font-weight:600; min-height:var(--tap); display:flex; align-items:center; }
  .breakdown h3 { margin:var(--sp-3) 0 var(--sp-1); font-size:var(--fs-sm); color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .breakdown th, .breakdown td { white-space:nowrap; }
  .breakdown tr.sum td, .breakdown tr.sum th { font-weight:700; border-top:2px solid var(--line); }
  .h2h th, .h2h td { white-space:nowrap; }
  .h2h small, .breakdown small { display:block; color:var(--muted); font:var(--fs-xs) var(--font); }
  .muted { color:var(--muted); margin:0; }
  .games span { font-family:var(--font-num); color:var(--muted); margin-right:var(--sp-1); }
  .score { display:flex; align-items:baseline; gap:var(--sp-2); flex-wrap:wrap; }
  .score .diff { margin-left:auto; }
  .slate-head { display:flex; justify-content:space-between; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-2); }
  .slate-head h2 { margin:0; }
  .picker { display:flex; align-items:center; gap:var(--sp-1); }
  .picker button { padding:0 var(--sp-2); }
  .picker select { min-height:var(--tap); border:1px solid var(--line); border-radius:var(--r-pill); background:var(--card); color:var(--text); font:600 var(--fs-sm) var(--font); padding:0 var(--sp-2); }
  .picker :disabled { opacity:.5; cursor:default; }
  .score .big { font:700 var(--fs-xl) var(--font-num); }
  .score .vs { color:var(--muted); }
  .diff { font:600 var(--fs-md) var(--font-num); }
  .diff.pos { color:var(--win); } .diff.neg { color:var(--loss); }
  .days { display:grid; grid-template-columns:repeat(7,1fr); gap:var(--sp-1); }
  .day { border:1px solid var(--line); border-radius:var(--r-sm); text-align:center; padding:var(--sp-1) 0; }
  .day.today { border:2px solid var(--accent-line); }
  .day.past { background:var(--surface-2); }
  .day.past .n { color:var(--muted); }
  .day .d { font-size:var(--fs-sm); color:var(--muted); font-weight:600; }
  .day .n { font:700 var(--fs-lg) var(--font-num); }
  .day .o { font:700 var(--fs-lg) var(--font-num); color:var(--muted); border-top:1px solid var(--line); margin:0 var(--sp-1); }
  .day .dn { font-size:var(--fs-sm); color:var(--muted); }
  .day .nba, .day .st { font-size:var(--fs-xs); color:var(--muted); }
  .day .st { min-height:1lh; }
  .legend { display:flex; gap:var(--sp-3); margin:var(--sp-2) 0 0; font-size:var(--fs-xs); color:var(--muted); }
  table { width:100%; border-collapse:collapse; }
  th, td { height:var(--row-h); padding:0 var(--sp-2); text-align:right; border-bottom:1px solid var(--line); }
  td { font-family:var(--font-num); }
  tbody tr { transition:background-color var(--dur); }
  tbody tr:hover { background:var(--row-hover); }
  th:first-child, td:first-child { text-align:left; font-family:var(--font); }
  th { color:var(--muted); font-size:var(--fs-sm); font-weight:600; }
  td.W { color:var(--win); font-weight:700; } td.L { color:var(--loss); font-weight:700; } td.T { color:var(--muted); }
  .stack { display:grid; gap:var(--sp-2); align-content:start; min-width:0; }
  .error { color:var(--loss); padding:var(--sp-4); }
</style>
</head>
<body>
<header>
  <h1 id="team">Loading…<small id="league"></small></h1>
  <div class="refresh">
    <nav class="nav-row" aria-label="Pages"><a class="button" href="#">Dashboard</a><a class="button" href="#planner">Weekly planner</a><a class="button" href="#streaming">Streaming</a><button id="refresh" class="ghost">Refresh</button></nav>
    <small id="updated" aria-live="polite"></small>
  </div>
</header>
<main id="app"></main>
<div id="h2h" class="h2h" role="dialog" aria-labelledby="h2h-title" hidden>
  <div class="h2h-head"><strong id="h2h-title"></strong><button class="ghost" type="button" aria-label="Close" onclick="closeH2H()"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.75"/></svg></button></div>
  <div id="h2h-body"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (c, v) => c.endsWith("%") ? Number(v).toFixed(3).replace(/^0/, "") : Math.round(v);
const headshot = id => `https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;

const gameDay = iso => new Date(iso + "T00:00").toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" });

// ---- Dashboard matchup card: category odds, who plays toggles, night by night ----
const sits = {};  // player id -> true (sits) / false (plays) when flipped on the page; default: OUT sits, others play
const isPlaying = a => sits[a.id] === undefined ? a.counted : !sits[a.id];
// shortcut: rough game-to-game spread per counting stat (variance ≈ k × expected total); calibrate against real weeks
const SPREAD = { PTS: 2, REB: 1.5, AST: 1.5, STL: 1.2, BLK: 1.5, "3PM": 1.3, TO: 1.2 };
const KEYS = ["PTS", "REB", "AST", "STL", "BLK", "3PM", "TO", "FGM", "FGA", "FTM", "FTA"];
const erf = x => {  // Abramowitz-Stegun 7.1.26
  const t = 1 / (1 + 0.3275911 * Math.abs(x));
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return x >= 0 ? y : -y;
};
const normCdf = z => 0.5 * (1 + erf(z / Math.SQRT2));

// Remaining stats for one team: the projection's counted players, adjusted by the plays/sits toggles
function teamLine(current, rows, avail) {
  const rem = Object.fromEntries(KEYS.map(k => [k, rows.reduce((t, r) => t + (r[k] || 0), 0)]));
  for (const a of avail) {
    const sign = isPlaying(a) && !a.counted ? 1 : !isPlaying(a) && a.counted ? -1 : 0;
    for (const k of KEYS) rem[k] += sign * (a.line[k] || 0);
  }
  const tot = Object.fromEntries(["PTS", "REB", "AST", "STL", "BLK", "3PM", "TO"].map(c => [c, (current[c] || 0) + rem[c]]));
  tot["FG%"] = rem.FGA ? rem.FGM / rem.FGA : current["FG%"] || 0;  // like the server: percentages from games left only
  tot["FT%"] = rem.FTA ? rem.FTM / rem.FTA : current["FT%"] || 0;
  return { tot, rem };
}

function matchupOdds(d) {
  const p = d.projection, av = p.availability || { mine: [], theirs: [] };
  const A = teamLine(p.current.mine, p.players.mine, av.mine), B = teamLine(p.current.theirs, p.players.theirs, av.theirs);
  const prob = {};
  for (const c of CATS9) {
    let diff = A.tot[c] - B.tot[c], v;
    if (c === "TO") diff = -diff;
    if (c.endsWith("%")) {
      const k = c === "FG%" ? "FGA" : "FTA", pa = A.tot[c], pb = B.tot[c];
      v = (A.rem[k] ? pa * (1 - pa) / A.rem[k] : 0) + (B.rem[k] ? pb * (1 - pb) / B.rem[k] : 0);
    } else v = SPREAD[c] * (A.rem[c] + B.rem[c]);
    prob[c] = v > 0 ? normCdf(diff / Math.sqrt(v)) : diff > 0 ? 1 : diff < 0 ? 0 : 0.5;
  }
  // chance of winning more categories: combine the 9 independent category chances
  let dist = [1];
  for (const c of CATS9) dist = dist.map((x, k) => x * (1 - prob[c])).concat(0).map((x, k) => x + (k ? dist[k - 1] * prob[c] : 0));
  const win = dist.slice(5).reduce((t, x) => t + x, 0);
  const expected = CATS9.reduce((t, c) => t + prob[c], 0);
  return { mine: A.tot, theirs: B.tot, prob, win, expected, swing: CATS9.filter(c => prob[c] >= 0.35 && prob[c] <= 0.65) };
}

function matchupCard(d) {
  const w = d.week, days = weekDays(d), today = new Date(w.today + "T00:00");
  const md = dt => dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const head = `<div class="slate-head"><h2>Week ${w.number} · ${md(days[0])} – ${md(days[days.length - 1])}${d.opponent ? ` · vs ${esc(d.opponent)}` : ""}</h2>${weekPicker(d)}</div>`;
  if (!d.projection) return `<section class="card wide">${head}<p class="muted">Bye week: no matchup.</p></section>`;
  const o = matchupOdds(d), pc = x => `${Math.round(x * 100)}%`;
  const final = days.filter(dt => dt < today).length;
  const cats = CATS9.map(c => {
    const pr = o.prob[c];
    const now = d.projection.current, lead = now.result[c];  // actual totals so far this week, from ESPN
    // lead as a share of the bigger total (FG%/FT%: a 5-point lead fills the bar), -1 theirs … +1 yours; TO: fewer leads
    const margin = (a, b) => {
      let m = c.endsWith("%") ? (a - b) / 0.05 : (a - b) / (Math.max(Math.abs(a), Math.abs(b)) || 1);
      return Math.max(-1, Math.min(1, c === "TO" ? -m : m));
    };
    const line = (m, cls) => `<span class="${cls} ${m >= 0 ? "you" : "opp"}" style="${m >= 0 ? "right:50%" : "left:50%"};width:${Math.abs(m) * 50}%"></span>`;
    return `<div class="mc-row"><span class="mc-v you">${fmt(c, o.mine[c])}<small class="${lead === "W" ? "pos" : ""}">act. ${fmt(c, now.mine[c] || 0)}</small></span>
      <span class="mc-bar">${line(margin(now.mine[c] || 0, now.theirs[c] || 0), "mc-fill")}${line(margin(o.mine[c], o.theirs[c]), "mc-proj")}<span class="mc-cat">${c}</span></span>
      <span class="mc-v opp">${fmt(c, o.theirs[c])}<small class="${lead === "L" ? "neg" : ""}">act. ${fmt(c, now.theirs[c] || 0)}</small></span><span class="mc-p ${pr >= 0.65 ? "pos" : pr <= 0.35 ? "neg" : "mid"}">${pc(pr)}</span></div>`;
  }).join("");
  const av = d.projection.availability || { mine: [], theirs: [] };
  const who = (rows, label) => `<div class="who"><h3>${label}</h3>${rows.length ? rows.map(a => `<div class="who-row">
      <img class="pic sm" src="${headshot(a.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span><b>${esc(a.name)}</b><small>${esc(a.status.replace("_", " "))} · ${a.games} game${a.games === 1 ? "" : "s"} left</small></span>
      <button class="switch" role="switch" data-toggle="${a.id}" aria-checked="${isPlaying(a)}" aria-label="${esc(a.name)} plays">${isPlaying(a) ? "Plays" : "Sits"}</button></div>`).join("")
    : '<p class="muted">Everyone healthy.</p>'}</div>`;
  const mine = d.slate.mine, theirs = d.slate.theirs || mine.map(() => 0), max = Math.max(1, ...mine, ...theirs);
  const nights = days.map((dt, i) => `<div class="nn-row${dt.getTime() === today.getTime() ? " today" : ""}${dt < today ? " past" : ""}">
      <span class="nn-day">${dt.getTime() === today.getTime() ? "Today" : dt.toLocaleDateString(undefined, { weekday: "short" }) + " " + dt.getDate()}</span>
      <span class="nn-bars"><span class="bar you" style="width:${mine[i] / max * 100}%"></span><span class="bar opp" style="width:${theirs[i] / max * 100}%"></span></span>
      <span class="nn-n">${mine[i]} v ${theirs[i]}</span><span class="nn-d ${mine[i] - theirs[i] > 0 ? "pos" : mine[i] - theirs[i] < 0 ? "neg" : ""}">${mine[i] - theirs[i] > 0 ? "+" : ""}${mine[i] - theirs[i]}</span></div>`).join("");
  const todo = o.swing.length
    ? `The week turns on ${o.swing.map(c => `${c} (${pc(o.prob[c])})`).join(" and ")}: a streamer strong there helps most. <a href="#streaming">Plan pickups</a>.`
    : `No category is a toss-up right now; ${o.win >= 0.5 ? "protect your leads" : "you need a big swing in several categories"}.`;
  const p = d.projection;
  return `<section class="card wide matchup">${head}<div class="mc-grid"><div>
      <div class="mc-big"><span class="num">${o.expected.toFixed(1)}</span><span>of 9 categories expected</span></div>
      <p class="mc-sub">vs <b>${esc(d.opponent)}</b> ${(9 - o.expected).toFixed(1)} · <b class="${o.win >= 0.5 ? "pos" : "neg"}">${pc(o.win)}</b> to take more categories · ${final} of ${days.length} nights final · right now <b>${tally(d.projection.current.result).join("-")}</b></p>
      <div class="mc-labels"><span>You</span><span class="mc-key">thick line = actual lead · thin = projected end · numbers: big = projected, act. = actual</span><span>${esc(d.opponent)}</span><span>Win %</span></div>
      ${cats}
      <details class="breakdown"><summary>Per-player breakdown</summary>
        <p class="muted">Starters in your set ESPN lineup: season average × games not started yet, added to this week's totals so far. Plays/Sits toggles aren't reflected here.</p>
        ${breakdownTable("You", p.players.mine, p.current.mine, p.mine)}
        ${breakdownTable(d.opponent, p.players.theirs, p.current.theirs, p.theirs)}
      </details></div>
    <div class="mc-side">
      <div class="tiles3"><div class="tile"><span>Win odds</span><b class="${o.win >= 0.5 ? "pos" : "neg"}">${pc(o.win)}</b><small>${final} of ${days.length} nights final</small></div>
        <div class="tile"><span>Projected</span><b>${o.expected.toFixed(1)}</b><small>of 9 categories</small></div>
        <div class="tile"><span>Swing</span><b>${o.swing.length}</b><small>categories 35–65%</small></div></div>
      <h3>Who plays <small>flip to see the odds change</small></h3>
      <div class="who-grid">${who(av.mine, "You")}${who(av.theirs, esc(d.opponent))}</div>
      <h3>Night by night <small>starting games, you v them</small></h3>${nights}
      <p><b>What to do:</b> ${todo}</p>
      <p class="muted">Odds treat each category's projected margin against how much it usually swings over the games left; FG%/FT% use attempts left. A rough guide, not a guarantee.</p>
    </div></div></section>`;
}

// ---- Live game + last 3 games inside a player's dashboard dropdown ----
const liveData = {};  // player id -> /api/live response, or { error }
let liveTimer;
const statLine = st => [["PTS", st.PTS], ["REB", st.REB], ["AST", st.AST], ["STL", st.STL], ["BLK", st.BLK], ["3PM", st["3PM"]], ["TO", st.TO]]
  .map(([k, v]) => `<span><b>${esc(v || "0")}</b> ${k}</span>`).join("")
  + `<span><b>${esc(st["FG%"] || "0-0")}</b> FG</span><span><b>${esc(st["FT%"] || "0-0")}</b> FT</span>${st.MIN ? `<span><b>${esc(st.MIN)}</b> MIN</span>` : ""}`;

function liveHtml(id) {
  const x = liveData[id];
  if (!x) return '<p class="muted">Loading today\'s game…</p>';
  if (x.error) return `<p class="muted">Couldn't load live stats: ${esc(x.error)}</p>`;
  const t = x.today, when = new Date(x.updated).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  const today = !t ? '<p class="muted">No game today.</p>' : `<div class="live-today">
      <div class="lt-head"><b>Today ${esc(t.at)} ${esc(t.opp)}</b><span class="lt-status ${t.state}">${t.state === "in" ? "Live · " : ""}${esc(t.status)}</span></div>
      ${t.line ? `<div class="stat-line">${statLine(t.line)}</div>` : `<p class="muted">${t.state === "pre" ? "Hasn't started yet." : "No stats for him in this game."}</p>`}
      <small class="muted">Updated ${when}${t.state === "in" ? " · refreshes every minute while this is open" : ""}</small></div>`;
  const rows = x.last3.map(g => `<tr><th scope="row">${gameDay(g.date)}<small>${esc(g.at || "")} ${esc(g.opp || "")} ${esc(g.result || "")}</small></th>
      ${["PTS", "REB", "AST", "STL", "BLK", "3PM", "TO"].map(k => `<td>${esc(g.stats[k] ?? "")}</td>`).join("")}
      <td>${pct(g.stats["FG%"] || "0-0")}<small>${esc(g.stats["FG%"] || "")}</small></td><td>${pct(g.stats["FT%"] || "0-0")}<small>${esc(g.stats["FT%"] || "")}</small></td></tr>`).join("");
  const last = x.last3.length ? `<div class="h2h-scroll"><table class="last3"><caption>Last ${x.last3.length} games</caption>
      <thead><tr><th scope="col">Game</th>${["PTS", "REB", "AST", "STL", "BLK", "3PM", "TO", "FG%", "FT%"].map(k => `<th scope="col">${k}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>` : "";
  return today + last;
}

async function loadLive(id) {
  clearTimeout(liveTimer);
  try {
    const r = await fetch(`/api/live/${id}`);
    const j = await r.json().catch(() => ({ detail: `${r.status} ${r.statusText}` }));
    liveData[id] = r.ok ? j : { error: j.detail };
  } catch (e) {
    liveData[id] = { error: e.message };
  }
  const box = document.querySelector(`[data-live="${id}"]`);
  if (box) box.innerHTML = liveHtml(id);
  // keep a live game fresh while this player's panel stays open
  if (liveData[id]?.today?.state === "in" && openPlayer !== null && lastData?.roster[openPlayer]?.id === id)
    liveTimer = setTimeout(() => openPlayer !== null && lastData?.roster[openPlayer]?.id === id && loadLive(id), 60000);
}

function rosterCard(d) {
  const rows = d.roster.map((p, i) => `
    <div class="player">
      <div class="row">
        <img src="${headshot(p.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.pos)} · ${esc(p.team)}</div></div>
        <div class="tag">
          ${p.pending ? `<span class="pend">${esc(p.pending)}</span>` : ""}
          ${p.injury ? `<span class="inj">${esc(p.injury.replace("_", " "))}</span>` : ""}
          <span class="gl">${p.games_left} G left</span>
          <button data-news="${i}" aria-expanded="${i === openPlayer}" aria-controls="news-${i}">Games${p.news.length ? ` · ${p.news.length} news` : ""} <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.75"/></svg></button>
        </div>
      </div>
      <div class="news${i === openPlayer ? " open" : ""}" id="news-${i}">
        <div class="live" data-live="${p.id}" aria-live="polite">${i === openPlayer ? liveHtml(p.id) : ""}</div>
        <ul class="games" aria-label="Games left this matchup">${p.upcoming.length
          ? p.upcoming.map(g => `<li><button class="chip" data-h2h="${p.id}" data-opp="${esc(g.opp)}" data-name="${esc(p.name)}" aria-haspopup="dialog" aria-expanded="false"><span>${gameDay(g.date)}</span> vs ${esc(g.opp)}</button></li>`).join("")
          : "<li>No games left this matchup</li>"}</ul>
        ${p.news.map(n => `<p><span class="tag">${esc(n.kind)}</span> <b>${esc(n.headline)}</b><br>${esc(n.tldr)}</p>`).join("")}
      </div>
    </div>`).join("");
  // how many players can fill each position, e.g. 4×PG · 7×SG
  const pos = ["PG", "SG", "SF", "PF", "C"].map(x => [x, d.roster.filter(p => p.pos.split("/").includes(x)).length]).filter(([, n]) => n).map(([x, n]) => `${n}×${x}`).join(" · ");
  return `<section class="card wide"><div class="slate-head"><h2>${esc(d.team)} · ${d.roster.length} players</h2><span class="muted">${pos}</span></div>${rows}</section>`;
}

function weekPicker(d) {
  const w = d.week, opts = Array.from({ length: w.count }, (_, i) => i + 1)
    .map(n => `<option value="${n}" ${n === w.number ? "selected" : ""}>Week ${n}${n === w.current ? " (now)" : ""}</option>`).join("");
  return `<div class="picker">
      <button class="ghost" data-week="${w.number - 1}" aria-label="Previous week" ${w.number <= 1 ? "disabled" : ""}>‹</button>
      <select id="week" aria-label="Matchup week">${opts}</select>
      <button class="ghost" data-week="${w.number + 1}" aria-label="Next week" ${w.number >= w.count ? "disabled" : ""}>›</button>
    </div>`;
}

const weekDays = d => {
  const start = new Date(d.week.start + "T00:00");
  return d.slate.mine.map((_, i) => new Date(start.getTime() + i * 864e5));
};

// ---- Streaming page (#streaming) ----
const stream = { data: null, plan: null, acq: null, loading: false, error: null };
let drops;  // player ids you're willing to drop; remembered in this browser only
try { drops = new Set(JSON.parse(localStorage.getItem("drops") || "[]")); } catch { drops = new Set(); }

// redraw the streaming page, keeping keyboard focus on the switch that was focused
function redrawStream() {
  if (location.hash !== "#streaming" || !lastData) return;
  const keep = document.activeElement?.dataset?.drop;
  render(lastData);
  if (keep) document.querySelector(`[data-drop="${keep}"]`)?.focus();
}

async function loadStream(plan = false) {
  stream.loading = true;
  redrawStream();
  try {
    const q = new URLSearchParams({ drops: [...drops].join(",") });
    if (stream.acq !== null && stream.acq !== "") q.set("acq", stream.acq);
    if (plan) q.set("plan", "true");
    const r = await fetch("/api/stream?" + q);
    const j = await r.json().catch(() => ({ detail: `${r.status} ${r.statusText}` }));
    if (!r.ok) throw new Error(j.detail);
    stream.data = j;
    if (plan) stream.plan = j.plan || null;
    stream.error = null;
  } catch (e) {
    stream.error = e.message;
  }
  stream.loading = false;
  redrawStream();
}

function streamView() {
  if (!stream.data) {
    if (!stream.loading && !stream.error) loadStream(drops.size > 0);  // plan right away if players are already droppable
    return `<section class="card">${stream.error ? `<p class="error">Could not load: ${esc(stream.error)}</p>` : '<p class="muted">Loading roster…</p>'}</section>`;
  }
  const s = stream.data, a = s.acquisitions;
  const acqNote = a.left != null ? `ESPN: ${a.left} left this matchup (${a.used} of ${a.limit} used)`
    : a.limit == null ? "ESPN shows no weekly limit; set how many adds to plan" : `Limit ${a.limit} a week; ESPN didn't say how many you've used`;
  const roster = s.roster.map(p => `<div class="drop">
      <img class="pic sm" src="${headshot(p.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span><b>${esc(p.name)}</b>${p.injury ? ` <span class="inj">${esc(p.injury.replace("_", " "))}</span>` : ""}${p.pending ? ` <span class="pend">${esc(p.pending)}</span>` : ""}
      <small>${esc(p.slot || "–")} · ${esc(p.team)} · ${p.starts_left} starts left this week${p.value != null ? ` · overall value ${p.value >= 0 ? "+" : ""}${p.value}` : ""}</small></span>
      <button class="switch" role="switch" data-drop="${p.id}" aria-checked="${drops.has(p.id)}" aria-label="${esc(p.name)} droppable">${drops.has(p.id) ? "Droppable" : "Stay"}</button></div>`).join("");
  const setup = `<section class="card"><h2>Who can go?</h2><p class="muted">Flip players to Droppable; the plan updates right away.</p>${roster}
    <div class="acq"><label for="acq"><b>Max adds</b></label>
      <input id="acq" type="number" inputmode="numeric" min="0" max="20" value="${esc(stream.acq ?? a.left ?? "")}">
      <span class="muted">${acqNote}</span></div>
    ${acqDetails(a, s.week)}
    <p class="muted" aria-live="polite">${stream.loading ? "Planning…" : ""}</p>
    ${stream.error ? `<p class="error">${esc(stream.error)}</p>` : ""}</section>`;
  return `<div class="stack">${setup}</div><div class="stack">${planCard(s)}</div>`;
}

// Shows where the adds-left number came from, so a wrong count can be traced
function acqDetails(a, w) {
  const list = xs => xs.length ? `<ul>${xs.map(m => `<li>${esc(m.date)} · ${esc(m.action)} · ${esc(m.player)}</li>`).join("")}</ul>` : " none";
  const c = a.counter;
  return `<details class="breakdown"><summary>How adds left was counted</summary><ul class="muted">
    <li>Limit from your league settings: <b>${a.per_period ? `${a.per_period} per scoring period × ${a.limit / a.per_period} days = ${a.limit} this matchup` : a.limit ?? "not set"}</b></li>
    <li>Matchup days: ${esc(w.start)} to ${esc(w.end)}</li>
    <li>Your adds in those days (from the league activity log):${list(a.counted)}</li>
    <li>Your latest adds, any date:${list(a.recent)}</li>
    <li>ESPN team counter: ${c ? `this week ${c.this_week ?? "missing"}, by week ${esc(JSON.stringify(c.by_week ?? null))}, season ${c.season ?? "missing"}` : "not available"}</li>
    ${a.errors.map(e => `<li class="error">${esc(e)}</li>`).join("")}</ul></details>`;
}

// Spider chart comparing two stat lines across the 9 categories. Each axis is scaled so the better of the two
// reaches the edge (TO: fewer is better), so the bigger shape on an axis is the better player there.
const RADAR_CATS = ["PTS", "3PM", "AST", "STL", "BLK", "REB", "FG%", "FT%", "TO"];
function radar(a, b, aName, bName) {
  const n = RADAR_CATS.length, R = 88, cx = 200, cy = 140;
  const score = (c, v, w) => c === "TO" ? (v ? Math.min(v, w) / v : 1) : Math.max(v, w) ? v / Math.max(v, w) : 0;
  const pt = (i, r) => { const t = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
  const poly = vals => vals.map((r, i) => pt(i, r).map(x => x.toFixed(1)).join(",")).join(" ");
  const ring = f => `<polygon points="${poly(RADAR_CATS.map(() => R * f))}" class="rd-ring"/>`;
  const va = RADAR_CATS.map(c => R * (0.15 + 0.85 * score(c, a[c], b[c]))), vb = RADAR_CATS.map(c => R * (0.15 + 0.85 * score(c, b[c], a[c])));
  const labels = RADAR_CATS.map((c, i) => {
    const [x, y] = pt(i, R + 30), anchor = Math.abs(x - cx) < 10 ? "middle" : x > cx ? "start" : "end";
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="rd-cat">${c}</text>
      <text x="${x.toFixed(1)}" y="${(y + 14).toFixed(1)}" text-anchor="${anchor}" class="rd-val"><tspan class="rd-a">${perGame(c, a[c])}</tspan> · ${perGame(c, b[c])}</text>`;
  }).join("");
  const dots = (vals, cls) => vals.map((r, i) => { const [x, y] = pt(i, r); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" class="${cls}"/>`; }).join("");
  const summary = RADAR_CATS.map(c => `${c} ${perGame(c, a[c])} vs ${perGame(c, b[c])}`).join(", ");
  return `<svg class="radar" viewBox="0 0 400 290" role="img" aria-label="${esc(aName)} vs ${esc(bName)}, per game: ${summary}">
    ${[0.25, 0.5, 0.75, 1].map(ring).join("")}
    ${RADAR_CATS.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="rd-ring"/>`; }).join("")}
    <polygon points="${poly(vb)}" class="rd-b"/><polygon points="${poly(va)}" class="rd-a-fill"/>
    ${dots(vb, "rd-b-dot")}${dots(va, "rd-a-dot")}${labels}</svg>`;
}

function planCard(s) {
  const head = `<h2>Pickup plan · week ${s.week.number}${s.opponent ? ` vs ${esc(s.opponent)}` : ""}</h2>`;
  if (!s.opponent) return `<section class="card">${head}<p class="muted">Bye week: no matchup to plan for.</p></section>`;
  const p = stream.plan;
  if (!p) return `<section class="card">${head}<p class="muted">Flip the players you'd drop to <b>Droppable</b>; the plan appears here right away.
    The plan tries every top free agent with each player you'd drop, and suggests streams that win this week's categories and upgrades that make your team better overall.</p></section>`;
  const moves = p.moves.length ? `<ol class="moves">${p.moves.map(m => {
    const a = m.add.line || {}, b = m.drop.line || {};
    const left = Object.fromEntries(CATS9.map(c => [c, lineVal(a, c)])), right = Object.fromEntries(CATS9.map(c => [c, lineVal(b, c)]));
    const res = Object.fromEntries(CATS9.map(c => [c, cmpCat(c, left[c], right[c])]));
    return `<li class="move"><div class="meta-line"><span class="kind ${m.kind}">${m.kind === "upgrade" ? "Upgrade" : "Stream"}</span> ${gameDay(m.day)} ·
        ${m.games.length ? `counts ${m.games.length} game${m.games.length === 1 ? "" : "s"} this week (${m.games.map(gameDay).join(", ")})` : "no games left this week"} · ${m.next_games} next week</div>
      <div class="rd-wrap">${radar(left, right, m.add.name, m.drop.name)}
        <div class="rd-legend"><div class="rd-head"><span>Season averages per game</span><span>9-cat value</span></div>
          ${[[m.add, "a", "Add"], [m.drop, "b", "Drop"]].map(([x, k, verb]) => `<div class="rd-who"><span class="sw ${k}" aria-hidden="true"></span>
            <img class="pic sm" src="${headshot(x.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
            <span><b>${verb} ${esc(x.name)}</b><small>${adjText(x)}</small></span>
            <b class="${x.value >= 0 ? "pos" : "neg"}">${x.value >= 0 ? "+" : ""}${(x.value ?? 0).toFixed(1)}</b></div>`).join("")}
          <p class="muted">Bigger on an axis = better there (TO: fewer). Values: <span class="rd-a">add</span> · drop.</p></div></div>
      <div class="meta-line">This week: ${m.week > 0 ? "+" : ""}${m.week} cat${Math.abs(m.week) === 1 ? "" : "s"} · Value this week + next: ${m.value >= 0 ? "+" : ""}${m.value}</div></li>`;
  }).join("")}</ol>`
    : '<p class="muted">No pickup improves your projected result with these drops and adds. Try allowing more drops.</p>';
  return `<section class="card">${head}
    <p><b>Projected ${p.before.record} → ${p.after.record}</b> (W-L-T)</p>${moves}
    <h2>Week with this plan</h2>${scoreLine(p.after.result, s.opponent)}
    ${vsHead({ name: "You · with plan", sub: "small: now" }, { name: s.opponent, sub: "Opponent" })}
    ${vsRows(CATS9, p.after.mine, p.theirs, p.after.result, fmt, c => "now " + fmt(c, p.before.mine[c]))}
    <details class="breakdown" open><summary>What makes up these totals</summary>
      <p class="muted">Each total = this week's ESPN totals so far + every counted player's season average × the games he still has (pickups and drops marked).
        FG% and FT% come only from games still to come, because ESPN doesn't give makes and attempts so far.</p>
      ${breakdownTable("You · with plan", p.players, p.current, p.after.mine)}
      ${breakdownTable(s.opponent, p.opp_players, p.opp_current, p.theirs)}
    </details>
    <p class="muted">Pickup cards show season averages (as on ESPN). The plan itself scales them by the “Projection ×” factor under each player: recent minutes (last 7 or 15 days) vs season, moved up or down by role news from the last 7 days, so a player taking over a teammate's role projects higher; a pickup only counts on days you have an open starting spot. <b>Stream</b> = wins more categories this week without dropping a clearly better player. <b>Upgrade</b> = adds clear value over the rest of this week and next week's matchup (per-game value across all 9 categories × games he plays), even if it doesn't change this week. Players with no games this week or next aren't suggested. Only healthy free agents are suggested (anyone listed OUT, day-to-day, on injured reserve or suspended is skipped). Adds happen by a player's game day, before tip-off.</p></section>`;
}

// ---- Weekly planner page (#planner) ----
const planner = { roster: "mine", stat: "Impact", teams: new Set(), open: new Set(), days: new Set() };

function matchupGamesCard(d) {
  const today = new Date(d.week.today + "T00:00"), days = weekDays(d);
  const mine = d.slate.mine, theirs = d.slate.theirs || mine.map(() => 0);
  const left = a => a.reduce((sum, n, i) => sum + (days[i] >= today ? n : 0), 0);
  const p = d.projection;
  const [w, l] = p ? tally(p.result) : [0, 0];
  const status = !p ? "Bye week" : w > l ? `Winning ${w}-${l}` : w < l ? `Losing ${w}-${l}` : `Tied ${w}-${l}`;
  // projected category totals as paired bars; the leading side's bar is bright, its label colored
  const bars = p ? CATS9.map(c => {
    const a = p.mine[c] || 0, b = p.theirs[c] || 0, r = p.result[c], max = Math.max(a, b) || 1;
    return `<div class="cat-bar ${r}"><span class="cb-cat">${c}${c === "TO" ? '<span class="sr"> (fewer wins)</span>' : ""}</span>
      <span class="cb-bars"><span class="bar you${r === "W" ? " lead" : ""}" style="width:${a / max * 100}%"></span>
        <span class="bar opp${r === "L" ? " lead" : ""}" style="width:${b / max * 100}%"></span></span>
      <span class="cb-n">${fmt(c, a)} v ${fmt(c, b)}${r === "W" ? '<span class="sr"> (you lead)</span>' : r === "L" ? '<span class="sr"> (they lead)</span>' : ""}</span></div>`;
  }).join("") : "";
  return `<section class="card"><div class="slate-head"><h2>Your week · 9 cats · vs ${esc(d.opponent || "bye")}</h2>${weekPicker(d)}</div>
    <div class="gl-head"><span class="big you">${left(mine)}</span><small>games left<br>vs</small><span class="big opp">${left(theirs)}</span>
      <span class="status ${w > l ? "pos" : w < l ? "neg" : ""}">${status}</span></div>
    ${bars}
    <p class="muted">Projected finish: this week's ESPN totals plus projections for starts left. Blue = you, orange = ${esc(d.opponent || "opponent")}; the leading side's bar is bright and the category turns green (you lead) or red (they lead). TO: fewer wins.</p></section>`;
}

function teamGamesCard(d) {
  const days = weekDays(d), picked = i => !planner.days.size || planner.days.has(i);
  const groups = {};
  for (const [team, perDay] of Object.entries(d.planner.teams || {})) {
    const n = perDay.reduce((sum, g, i) => sum + (picked(i) ? g : 0), 0);
    if (n) (groups[n] ||= []).push(team);
  }
  // teams where one of your players has at least one start this week
  const mine = new Set(d.planner.mine.filter(r => r.days.includes("start")).map(r => r.team));
  const dayChips = `<div class="day-chips" role="group" aria-label="Count games on these days">
      <button class="chip day" data-day="all" aria-pressed="${!planner.days.size}">All</button>
      ${days.map((dt, i) => `<button class="chip day" data-day="${i}" aria-pressed="${planner.days.has(i)}">${dt.toLocaleDateString(undefined, { weekday: "short" })}</button>`).join("")}</div>`;
  const rows = Object.keys(groups).map(Number).sort((a, b) => b - a).map(n => `<div class="tg-row"><span class="tg-n">${n}</span>
      <span class="tg-teams">${groups[n].sort().map(t => `<button class="chip${mine.has(t) ? " mine" : ""}" data-team="${esc(t)}" aria-pressed="${planner.teams.has(t)}"${mine.has(t) ? ` aria-label="${esc(t)}, you have starters"` : ""}>${esc(t)}</button>`).join("")}</span></div>`).join("");
  return `<section class="card"><div class="slate-head"><h2>Games per team</h2><span class="muted">Click a team to filter</span></div>
    ${dayChips}
    ${rows || '<p class="muted">No NBA games on the days picked.</p>'}
    ${mine.size ? '<p class="muted">Bold outline: teams where you have a starter this week. Pick days to count only those nights.</p>' : ""}</section>`;
}

function rosterGuideCard(d) {
  if (!d.planner[planner.roster]) planner.roster = "mine";  // e.g. opponent chosen, then a bye week
  const rows = d.planner[planner.roster];
  const shown = planner.teams.size ? rows.filter(r => planner.teams.has(r.team)) : rows;
  const c = planner.stat;
  const days = weekDays(d), todayIdx = days.findIndex(dt => dt.toLocaleDateString("en-CA") === d.week.today);  // en-CA = local YYYY-MM-DD
  const one = v => (Math.round(v * 10) / 10).toFixed(1);
  const signed = v => `${v > 0 ? "+" : ""}${one(v)}`;
  const stats = (r, i) => r.actual?.[i] || r.avg;  // real stats for past days, season average otherwise
  // one stat from a stat line: counting stats as is; FG%/FT% are makes ÷ attempts
  const show = (t, st) => {
    if (!st.endsWith("%")) return one(t[st] || 0);
    const [m, a] = st === "FG%" ? ["FGM", "FGA"] : ["FTM", "FTA"];
    return t[a] ? pct(`${t[m]}-${t[a]}`) : "—";
  };
  const cell = (r, s, i, st) => {
    const today = i === todayIdx ? " today" : "", opp = r.opps?.[i] ? `<small>${esc(r.opps[i])}</small>` : "";
    if (s !== "start") return `<td class="st-${s}${today}">${{ bench: "BE", out: "OUT", dnp: "DNP", off: "·" }[s]}${s !== "off" ? opp : ""}</td>`;
    if (st === "Impact") {
      const v = r.impact?.[i] ?? 0;
      return `<td class="imp ${v >= 0 ? "pos" : "neg"}${r.actual?.[i] ? " real" : ""}${today}">${signed(v)}${opp}</td>`;
    }
    return `<td class="${r.actual?.[i] ? "real" : ""}${today}">${show(stats(r, i), st)}${opp}</td>`;
  };
  const week = (r, st) => {
    if (r.slot === "IR") return "IR";
    if (st === "Impact") return `<span class="${r.impact_week >= 0 ? "pos" : "neg"}">${signed(r.impact_week || 0)}</span><small>${(r.top || []).join(" · ")}</small>`;
    const t = {};
    r.days.forEach((s, i) => { if (s === "start") for (const [k, v] of Object.entries(stats(r, i))) t[k] = (t[k] || 0) + v; });
    return show(t, st);
  };
  // Player panel: his effect on each category of this matchup, then a card for each of his games
  const proj = d.projection;
  const catStatus = c => {
    if (!proj) return "";
    const a = proj.mine[c] || 0, b = proj.theirs[c] || 0;
    const close = c.endsWith("%") ? Math.abs(a - b) < 0.01 : Math.abs(a - b) <= 0.05 * Math.max(a, b, 1);
    return close || proj.result[c] === "T" ? "close" : proj.result[c] === "W" ? "ahead" : "behind";
  };
  const details = r => {
    if (!planner.open.has(r.id)) return "";
    const started = r.days.map((s, i) => s === "start" ? i : -1).filter(i => i >= 0);
    const tot = {}, imp = {};
    for (const i of started) {
      for (const [k, v] of Object.entries(stats(r, i))) tot[k] = (tot[k] || 0) + v;
      for (const [k, v] of Object.entries(r.impact_cats?.[i] || {})) imp[k] = (imp[k] || 0) + v;
    }
    const helps = CATS9.filter(c => catStatus(c) === "close" && (imp[c] || 0) > 0.2);
    const costs = CATS9.filter(c => (imp[c] || 0) < -0.5).sort((a, b) => imp[a] - imp[b]).slice(0, 2);
    const summary = started.length
      ? `${helps.length ? `Helps your close categories: ${helps.join(", ")}` : "Doesn't move a close category"}${proj ? ` against ${esc(d.opponent)}` : ""}.${costs.length ? ` Costs you in ${costs.join(", ")}.` : ""}`
      : "No starts this week.";
    const extra = c => c === "FG%" ? ` · ${one(tot.FGA || 0)} FGA` : c === "FT%" ? ` · ${one(tot.FTA || 0)} FTA` : "";
    const tiles = CATS9.map(c => `<div class="tile ${catStatus(c)}"><div class="t-top"><span>${c}</span><span class="t-status">${catStatus(c)}</span></div>
        <div class="t-val">${!started.length ? "—" : c.endsWith("%") ? show(tot, c) : Math.round(tot[c] || 0)}</div>
        <div class="t-imp"><span class="${(imp[c] || 0) >= 0 ? "pos" : "neg"}">${signed(imp[c] || 0)}</span> this week${extra(c)}</div></div>`).join("");
    const games = r.days.map((s, i) => {
      if (!r.opps?.[i]) return "";
      const when = i < todayIdx ? "Final" : i === todayIdx ? "Today" : "To come";
      const head = `<div class="g-top">${days[i].toLocaleDateString(undefined, { weekday: "short" })} ${days[i].getDate()} · ${esc(r.opps[i])}<span>${when}</span></div>`;
      if (s !== "start") return `<div class="game">${head}<div class="g-imp muted">${{ bench: "On bench", out: "Out", dnp: "Started, no stats" }[s]}</div></div>`;
      const line = stats(r, i), cats = Object.entries(r.impact_cats?.[i] || {}).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([c]) => c);
      const v = r.impact?.[i] ?? 0;
      return `<div class="game">${head}<div class="g-imp"><b class="${v >= 0 ? "pos" : "neg"}">${signed(v)}</b> ${r.actual?.[i] ? "" : "projected, "}most in ${cats.join(", ")}</div>
        <div class="g-line">${["PTS", "REB", "AST"].map(k => `<b>${one(line[k] || 0)}</b> ${k}`).join(" ")}${r.actual?.[i] ? ` · ${Math.round(line.FGM || 0)}/${Math.round(line.FGA || 0)} FG` : ""}</div></div>`;
    }).join("");
    return `<tr class="panel-row"><td colspan="${days.length + 3}"><div class="pp">
      <p class="pp-sum">${summary}</p><div class="tiles">${tiles}</div><div class="games">${games}</div></div></td></tr>`;
  };
  const head = `<tr><th scope="col">Slot</th><th scope="col">Player</th>${days.map((dt, i) => `<th scope="col" class="${i === todayIdx ? "today" : ""}">${dt.toLocaleDateString(undefined, { weekday: "short" })}<small>${i < todayIdx ? "Final" : i === todayIdx ? "Today" : dt.getDate()}</small></th>`).join("")}<th scope="col">Week${c === "Impact" ? "" : " " + c}</th></tr>`;
  const body = shown.map(r => `<tr><td>${esc(r.slot || "–")}</td><th scope="row">
        <img class="pic sm" src="${headshot(r.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <button class="expand" data-expand="${r.id}" aria-expanded="${planner.open.has(r.id)}">${esc(r.name)} <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.75"/></svg></button>${r.injury ? ` <span class="inj">${esc(r.injury.replace("_", " "))}</span>` : ""}${r.pending ? ` <span class="pend">${esc(r.pending)}</span>` : ""}<small>${esc(r.team)}</small></th>
      ${r.days.map((s, i) => cell(r, s, i, c)).join("")}<td class="wk">${week(r, c)}</td></tr>${details(r)}`).join("");
  const opt = (v, label, cur) => `<option value="${v}" ${v === cur ? "selected" : ""}>${label}</option>`;
  const note = c === "Impact"
    ? "Impact = how much a game helps across all 9 categories compared with an average player on the two rosters (0 = average). Green helps, red hurts; <b>bold</b> = an actual game, plain = his average. Week = the week's total, with his two best categories."
    : `${c} on days a player starts: <b>bold</b> = actual stats from a past day, plain = season average. Week = actual so far + averages for starts left.`;
  return `<section class="card guide"><div class="slate-head"><h2>Roster guide</h2>
      <div class="picker">
        <select id="pl-roster" aria-label="Roster">${opt("mine", "Your team", planner.roster)}${d.planner.theirs ? opt("theirs", esc(d.opponent), planner.roster) : ""}</select>
        <select id="pl-stat" aria-label="Show">${["Impact", ...CATS9].map(x => opt(x, x, c)).join("")}</select>
      </div></div>
    <div class="h2h-scroll"><table><thead>${head}</thead><tbody>${body || `<tr><td colspan="${days.length + 3}" class="muted">No players on the selected teams.</td></tr>`}</tbody></table></div>
    <p class="muted">${note} Opponent under each game. Click a name for his category and game breakdown. BE = bench, OUT = injured, DNP = started but no stats, · = no game.${planner.teams.size ? ` Filtered to ${[...planner.teams].join(", ")}.` : ""}</p></section>`;
}

const CATS9 = ["PTS", "REB", "AST", "STL", "BLK", "3PM", "TO", "FG%", "FT%"];

function plannerView(d) {
  return `<div class="stack">${matchupGamesCard(d)}${teamGamesCard(d)}</div>${rosterGuideCard(d)}`;
}


// Live category scores from ESPN for the selected week, with who leads each one
// ---- Versus view: left side vs right side, categories in the middle, winning side filled ----
const lineVal = (l, c) => c === "FG%" ? (l.FGA ? l.FGM / l.FGA : 0) : c === "FT%" ? (l.FTA ? l.FTM / l.FTA : 0) : (l[c] || 0);
const cmpCat = (c, a, b) => { if (c === "TO") [a, b] = [b, a]; return a > b + 1e-9 ? "W" : b > a + 1e-9 ? "L" : "T"; };
const perGame = (c, v) => c.endsWith("%") ? (v ? v.toFixed(3).replace(/^0/, "") : "—") : (Math.round(v * 10) / 10).toFixed(1);

function vsRows(cats, left, right, res, show = fmt, sub = null) {
  return `<div class="vs" role="table">${cats.map(c => {
    const r = res[c], L = r === "W" ? "win" : r === "L" ? "lose" : "", R = r === "L" ? "win" : r === "W" ? "lose" : "";
    return `<div class="vs-row" role="row">
      <span class="vs-val left ${L}" role="cell">${show(c, left[c] || 0)}${r === "W" ? '<span class="sr"> (winning)</span>' : ""}${sub ? `<small>${sub(c)}</small>` : ""}</span>
      <span class="vs-cat" role="rowheader">${c}</span>
      <span class="vs-val right ${R}" role="cell">${show(c, right[c] || 0)}${r === "L" ? '<span class="sr"> (winning)</span>' : ""}</span></div>`;
  }).join("")}</div>`;
}

function vsHead(left, right, mid = "VS") {
  const side = (x, cls) => `<div class="vs-side ${cls}">${x.id ? `<img class="pic lg" src="${headshot(x.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ""}
    <span><b>${esc(x.name)}</b>${x.sub ? `<small>${x.sub}</small>` : ""}</span></div>`;
  return `<div class="vs-head">${side(left, "left")}<span class="vs-badge">${mid}</span>${side(right, "right")}</div>`;
}

// How the planner adjusts a player's season averages (recent minutes, role news); shown, not applied, in the card
const adjText = x => x.factor && Math.abs(x.factor - 1) >= 0.005
  ? `Projection ×${x.factor.toFixed(2)}${x.note ? ` · ${esc(x.note)}` : ""}` : "Projection: season averages";

const tally = res => { const n = r => Object.values(res).filter(x => x === r).length; return [n("W"), n("L"), n("T")]; };
const scoreLine = (res, oppName) => { const [w, l, t] = tally(res);
  return `<div class="vs-score"><span class="you">${w}</span><small>you · ${t} tied · ${esc(oppName)}</small><span class="opp">${l}</span></div>`; };



// One row per counted player: their projected stats for the rest of the week.
function breakdownTable(team, players, current, total) {
  const one = v => (Math.round(v * 10) / 10).toString();
  const pctCell = (m, a) => `<td>${a ? pct(`${m}-${a}`) : "—"}<small>${one(m)}-${one(a)}</small></td>`;
  const counting = ["3PM", "PTS", "REB", "AST", "STL", "BLK", "TO"];
  const head = `<tr><th scope="col">Player</th><th scope="col">G</th><th scope="col">FG%</th><th scope="col">FT%</th>${counting.map(c => `<th scope="col">${c}</th>`).join("")}</tr>`;
  const rows = players.map(r => `<tr><th scope="row">${esc(r.name)}</th><td>${r.games}</td>${pctCell(r.FGM, r.FGA)}${pctCell(r.FTM, r.FTA)}${counting.map(c => `<td>${one(r[c])}</td>`).join("")}</tr>`).join("");
  const sofar = `<tr><th scope="row">So far this week</th><td></td><td>${fmt("FG%", current["FG%"] || 0)}</td><td>${fmt("FT%", current["FT%"] || 0)}</td>${counting.map(c => `<td>${one(current[c] || 0)}</td>`).join("")}</tr>`;
  const sum = `<tr class="sum"><th scope="row">Projected</th><td></td><td>${fmt("FG%", total["FG%"])}</td><td>${fmt("FT%", total["FT%"])}</td>${counting.map(c => `<td>${fmt(c, total[c])}</td>`).join("")}</tr>`;
  return `<h3>${esc(team)}</h3><div class="h2h-scroll"><table><thead>${head}</thead><tbody>${rows}${sofar}${sum}</tbody></table></div>`;
}

let week = null;  // selected matchup week; null until the first load tells us the current one
let currentWeek = null;
let openPlayer = null;  // roster row whose games/news panel is open, kept open when fresh data arrives
let lastData = null;

function render(d) {
  lastData = d;
  const page = ["#planner", "#streaming"].includes(location.hash) ? location.hash : "#";
  $("#app").classList.toggle("planner", page !== "#");
  document.querySelectorAll(".nav-row a").forEach(a => a.getAttribute("href") === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  $("#app").innerHTML = page === "#planner" ? plannerView(d) : page === "#streaming" ? streamView()
    : matchupCard(d) + rosterCard(d);
}
window.addEventListener("hashchange", () => { closeH2H(); if (lastData) render(lastData); });

let loadGen = 0;  // newer loads cancel older ones' follow-up checks

async function load(refresh = false, poll = 0) {
  const gen = poll ? loadGen : ++loadGen;
  if (!poll) closeH2H();
  if (refresh) Object.assign(stream, { data: null, plan: null });  // streaming page refetches too
  if (!poll) document.querySelectorAll(".picker button, .picker select").forEach(x => x.disabled = true);
  try {
    const q = new URLSearchParams();
    if (week && week !== currentWeek) q.set("week", week);  // the current week shares one server cache entry, kept fresh in the background
    if (refresh) q.set("refresh", "true");
    const r = await fetch("/api/dashboard?" + q);
    const d = await r.json().catch(() => ({ detail: `${r.status} ${r.statusText}` }));  // non-JSON error pages
    if (!r.ok) throw new Error(d.detail || r.statusText);
    if (gen !== loadGen) return;  // the user picked another week meanwhile
    if (week !== d.week.number) openPlayer = null;
    week = d.week.number;
    currentWeek = d.week.current;
    $("#team").innerHTML = `${esc(d.team)}<small>${esc(d.league)}</small>`;
    $("#updated").textContent = (d.updated ? "Updated " + new Date(d.updated).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "")
      + (d.pending ? " · updating…" : "") + (d.warning ? ` · ${d.warning}` : "");
    render(d);
    // the server sent saved or partial data and is building the rest: check back until it's done (about 1 minute max)
    if (d.pending && poll < 30) setTimeout(() => gen === loadGen && load(false, poll + 1), 2000);
  } catch (e) {
    if (gen !== loadGen) return;
    if (poll) return;  // keep what's on screen if a follow-up check fails
    $("#app").innerHTML = `<p class="error">Could not load league: ${esc(e.message)}</p>`;
  }
}

const H2H_CATS = ["FG%", "FT%", "3PM", "PTS", "REB", "AST", "STL", "BLK", "TO"];
const h2hCache = {};
let h2hChip = null;
const pct = ma => { const [m, a] = ma.split("-").map(Number); return a ? (m / a).toFixed(3).replace(/^0/, "") : "—"; };

function h2hTable(name, d) {
  if (!d.games.length) return `<p class="muted">No games vs ${esc(d.opp)} in the last ${d.seasons} seasons.</p>`;
  const head = H2H_CATS.map(c => `<th scope="col">${c}</th>`).join("");
  const rows = d.games.map(g => `<tr><th scope="row">${esc(g.date)}<small>${esc(g.at)} ${esc(d.opp)} · ${esc(g.result)}</small></th>${
    H2H_CATS.map(c => c.endsWith("%") ? `<td>${pct(g.stats[c])}<small>${esc(g.stats[c])}</small></td>` : `<td>${esc(g.stats[c])}</td>`).join("")}</tr>`).join("");
  return `<div class="h2h-scroll"><table><thead><tr><th scope="col">Game</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function closeH2H() {
  $("#h2h").hidden = true;
  if (h2hChip) { h2hChip.setAttribute("aria-expanded", "false"); h2hChip = null; }
}

async function openH2H(chip) {
  closeH2H();
  h2hChip = chip;
  chip.setAttribute("aria-expanded", "true");
  const pop = $("#h2h"), { h2h: id, opp, name } = chip.dataset, key = id + "/" + opp;
  $("#h2h-title").textContent = `${name}: last 3 games vs ${opp}`;
  $("#h2h-body").innerHTML = `<p class="muted">Loading…</p>`;
  pop.hidden = false;
  const r = chip.getBoundingClientRect();
  pop.style.top = `${r.bottom + scrollY + 6}px`;
  pop.style.left = `${Math.max(16, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 16))}px`;
  try {
    if (!h2hCache[key]) {
      const res = await fetch(`/api/vs/${id}/${encodeURIComponent(opp)}`);
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `${res.status} ${res.statusText}`);
      h2hCache[key] = await res.json();
    }
    if (h2hChip === chip) $("#h2h-body").innerHTML = h2hTable(name, h2hCache[key]);
  } catch (err) {
    if (h2hChip === chip) $("#h2h-body").innerHTML = `<p class="muted">Couldn't load stats: ${esc(err.message)}</p>`;
  }
}

document.addEventListener("click", e => {
  const chip = e.target.closest("[data-h2h]");
  if (chip) return chip === h2hChip ? closeH2H() : openH2H(chip);
  if (!e.target.closest("#h2h")) closeH2H();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && h2hChip) { const c = h2hChip; closeH2H(); c.focus(); }
});

// Clicking anywhere on a player's row toggles their panel; only one panel stays open.
$("#app").addEventListener("click", e => {
  const row = e.target.closest(".player > .row");
  if (!row) return;
  const b = row.querySelector("[data-news]"), open = b.getAttribute("aria-expanded") !== "true";
  document.querySelectorAll("[data-news]").forEach(x => {
    x.setAttribute("aria-expanded", "false");
    $("#news-" + x.dataset.news).classList.remove("open");
  });
  b.setAttribute("aria-expanded", open);
  $("#news-" + b.dataset.news).classList.toggle("open", open);
  openPlayer = open ? Number(b.dataset.news) : null;
  clearTimeout(liveTimer);
  if (open) {  // today's game and last 3 games, fetched when the panel opens
    const id = lastData.roster[openPlayer].id;
    document.querySelector(`[data-live="${id}"]`).innerHTML = liveHtml(id);
    loadLive(id);
  }
});
$("#refresh").onclick = () => load(true);
let planTimer;
const planSoon = () => { clearTimeout(planTimer); planTimer = setTimeout(() => loadStream(true), 500); };  // wait for quick flips
$("#app").addEventListener("input", e => { if (e.target.id === "acq") { stream.acq = e.target.value; planSoon(); } });
$("#app").addEventListener("click", e => {
  const sw = e.target.closest("[data-drop]");
  if (!sw) return;
  const id = Number(sw.dataset.drop);
  drops.has(id) ? drops.delete(id) : drops.add(id);
  try { localStorage.setItem("drops", JSON.stringify([...drops])); } catch {}
  sw.setAttribute("aria-checked", drops.has(id));  // update in place so focus stays put
  sw.textContent = drops.has(id) ? "Droppable" : "Stay";
  planSoon();
});
// Week picker: every card reloads for the chosen matchup week
$("#app").addEventListener("click", e => {
  const b = e.target.closest("[data-week]");
  if (b) { week = Number(b.dataset.week); load(); }
});
$("#app").addEventListener("change", e => {
  if (e.target.id === "week") { week = Number(e.target.value); load(); }
  if (e.target.id === "pl-roster") { planner.roster = e.target.value; render(lastData); }
  if (e.target.id === "pl-stat") { planner.stat = e.target.value; render(lastData); }

});
// Games-per-team chips filter the roster guide
$("#app").addEventListener("click", e => {
  const x = e.target.closest("[data-expand]");
  if (x) {
    const id = Number(x.dataset.expand);
    planner.open.has(id) ? planner.open.delete(id) : planner.open.add(id);
    render(lastData);
    return document.querySelector(`[data-expand="${id}"]`)?.focus();
  }
  const sw = e.target.closest("[data-toggle]");
  if (sw) {  // who-plays switch: flip plays/sits and recompute the matchup odds
    const id = sw.dataset.toggle;
    sits[id] = sw.getAttribute("aria-checked") === "true";
    render(lastData);
    return document.querySelector(`[data-toggle="${id}"]`)?.focus();
  }
  const dayBtn = e.target.closest("[data-day]");
  if (dayBtn) {  // games-per-team day filter: "All" clears, a day toggles
    const v = dayBtn.dataset.day;
    if (v === "all") planner.days.clear(); else planner.days.has(+v) ? planner.days.delete(+v) : planner.days.add(+v);
    render(lastData);
    return document.querySelector(`[data-day="${v}"]`)?.focus();
  }
  const t = e.target.closest("[data-team]");
  if (!t) return;
  planner.teams.has(t.dataset.team) ? planner.teams.delete(t.dataset.team) : planner.teams.add(t.dataset.team);
  render(lastData);
  document.querySelector(`[data-team="${t.dataset.team}"]`)?.focus();
});
load();
</script>
</body>
</html>
