      ${sm.o.swing.length ? `Still in play: <b>${sm.o.swing.join(", ")}</b>.` : "No category is a toss-up."}</li>`);
  }
  // 2. lineup changes for today (or the next day with games)
  if (i >= 0) {
    const L = lineupBase(d, i), when = i === ti ? "today" : gameDay(L.day);
    const names = xs => xs.map(r => esc(r.name)).join(", ");
    const fixes = [];
    if (L.outInLineup.length) fixes.push(`${names(L.outInLineup)} ${L.outInLineup.length === 1 ? "is" : "are"} OUT but in a starting slot: bench ${L.outInLineup.length === 1 ? "him" : "them"}`);
    if (L.ins.length || L.outs.length) fixes.push(`start ${names(L.ins) || "—"}; sit ${names(L.outs) || "—"}`);
    items.push(`<li><b>Lineup ${when}:</b> ${fixes.length ? fixes.join(". ") + `. <a href="#lineup" data-lday-go="${L.day}">Open lineup</a>` : "set right, nothing to change."}</li>`);
  } else items.push(`<li><b>Lineup:</b> none of your players has a game left this week.</li>`);
  // 3. pickups to make today (streams and IR moves), from the Streaming plan with your Droppable choices
  const sp = stream.plan, sd = stream.data;
  if (!sp && !stream.error) {
    if (!stream.loading) loadStream(true);
    items.push(`<li><b>Pickups:</b> <span class="muted">checking free agents…</span></li>`);
  } else if (stream.error) items.push(`<li><b>Pickups:</b> <span class="error">couldn't check: ${esc(stream.error)}</span></li>`);
  else {
    const todays = (sp?.moves || []).filter(m => m.day === today);
    const later = (sp?.moves || []).filter(m => m.day > today);
    const say = m => `${m.ir ? `move ${esc(m.drop.name)} to IR` : `drop ${esc(m.drop.name)}`}, add <b>${esc(m.add.name)}</b> (${m.games.length} game${m.games.length === 1 ? "" : "s"} this week${m.win ? `, win ${Math.round(m.win[0] * 100)}% → ${Math.round(m.win[1] * 100)}%` : ""})`;
    items.push(`<li><b>Pickups today:</b> ${todays.length ? todays.map(say).join("; ") + " — before tip-off." : sp ? "none needed." : "mark who can go on Streaming to get suggestions."}
      ${later.length ? `<br><span class="muted">Later this week: ${later.map(m => `${gameDay(m.day)}: ${say(m)}`).join("; ")}.</span>` : ""} <a href="#streaming">Streaming</a></li>`);
  }
  // 4. the opponent: adds left and what his best streaming could do (Scouting page)
  if (d.projection) {
    const sc = scout.data;
    if (!sc && !scout.loading && !scout.error) loadScout();
    items.push(`<li><b>Opponent:</b> ${!sc ? '<span class="muted">scouting…</span>' : !sc.opponent ? "bye week." : `${sc.acquisitions?.left ?? "?"} adds left; if he streams hard you'd be ${sc.worst.record.replace(/-0$/, "")} (${sc.worst.expected.toFixed(1)} expected).
      ${atRisk(sc).length ? `<span class="neg">Protect <b>${atRisk(sc).join(", ")}</b>.</span>` : "Nothing at real risk."}`} <a href="#scout">Scouting</a></li>`);
  }
  // 5. health: injured players with a game today or still in the plans, with their latest injury news
  const news = Object.fromEntries((d.roster || []).map(p => [p.id, (p.news || []).find(n => n.kind === "Injury")]));
  const hurt = rows.filter(r => r.injury && (i < 0 || r.opps[i]));
  items.push(`<li><b>Health:</b> ${hurt.length ? `<ul>${hurt.map(r => `<li>${esc(r.name)} <span class="inj">${esc(r.injury.replace("_", " "))}</span>${news[r.id] ? ` · ${esc(news[r.id].headline)}` : ""}</li>`).join("")}</ul>` : "no injured players with a game."}</li>`);
  return `<section class="card wide today"><h2>Today · ${gameDay(today)}</h2><ol class="todo">${items.join("")}</ol>
    <p class="muted">Your morning list: everything here comes from the other pages (Dashboard odds, Lineup suggestion, Streaming plan), so it always agrees with them.</p></section>`;
}

// ---- Daily lineup page (#lineup): one day's players with a game, who ESPN starts, and who to start ----
const lineup = { day: null, choice: {} };  // ISO date picked (null = today or the next day with games); starters chosen per day

// Can all these players (each a list of eligible slot names) start at once in these slots? (augmenting paths)
function fitsLineup(players, slots) {
  const owner = new Map();
  const place = (i, seen) => slots.some((slot, j) => {
    if (!players[i].includes(slot) || seen.has(j)) return false;
    seen.add(j);
    if (!owner.has(j) || place(owner.get(j), seen)) { owner.set(j, i); return true; }
    return false;
  });
  return players.length <= slots.length && players.every((_, i) => place(i, new Set()));
}

const isoDay = x => x.toLocaleDateString("en-CA");

// Everything both the Lineup and Today pages need for day index i: who's on the team, ESPN's lineup, each player's
// matchup value and the suggested lineup. Matchup value = categories you're expected to win this week with him starting
// that day minus without him (dashboard odds), so close categories count and locked ones don't; the 9-cat value breaks ties.
function lineupBase(d, i) {
  const days = weekDays(d), rows = d.planner.mine, today = d.week.today;
  const day = isoDay(days[i]), past = day < today;
  const hasGame = r => !!r.opps[i] && r.days[i] !== "off";
  const avail = r => hasGame(r) && r.days[i] !== "out";
  const slotOf = r => (r.dslots ? r.dslots[i] : r.slot);
  const onTeam = rows.filter(r => slotOf(r));
  const slots = d.lineup || null;
  const spots = slots ? slots.length : onTeam.filter(r => !["BE", "IR"].includes(slotOf(r))).length;
  const espnOn = r => !["BE", "IR"].includes(slotOf(r));  // in ESPN's starting lineup that day
  const counted = r => espnOn(r) && avail(r) && !past;     // what the week projection counts for that day
  const mv = {};
  if (d.projection && !past) {
    const base = Object.fromEntries(KEYS.map(k => [k, 0]));  // the week without anyone's game that day
    for (const r of onTeam) if (counted(r)) for (const k of KEYS) base[k] -= r.avg[k] || 0;
    const e0 = matchupOdds(d, base).expected;
    for (const r of onTeam.filter(avail)) mv[r.id] = matchupOdds(d, Object.fromEntries(KEYS.map(k => [k, base[k] + (r.avg[k] || 0)]))).expected - e0;
  }
  const score = r => [mv[r.id] ?? 0, r.value ?? 0];
  const better = (a, b) => { const [x, y] = [score(a), score(b)]; return y[0] - x[0] || y[1] - x[1]; };
  // best lineup that fits the slots: greedy by matchup value over a slot matching
  const pick = [];
  for (const r of onTeam.filter(avail).sort(better)) {
    if (pick.length >= spots) break;
    if (!slots || fitsLineup([...pick, r].map(x => x.elig || []), slots)) pick.push(r);
  }
  const suggested = new Set(pick.map(r => r.id));
  const ins = onTeam.filter(r => avail(r) && suggested.has(r.id) && !espnOn(r));
  const outs = onTeam.filter(r => avail(r) && !suggested.has(r.id) && espnOn(r));
  const outInLineup = onTeam.filter(r => espnOn(r) && hasGame(r) && r.days[i] === "out");  // OUT but in a starting slot
  return { day, past, hasGame, avail, slotOf, onTeam, slots, spots, espnOn, mv, suggested, ins, outs, outInLineup, better };
}

function lineupView(d) {
  const days = weekDays(d), iso = isoDay, rows = d.planner.mine, today = d.week.today;
  const anyGame = k => rows.some(r => r.opps[k] && !["off", "out"].includes(r.days[k]));
  let i = days.findIndex(x => iso(x) === lineup.day);
  if (i < 0) i = Math.max(0, days.findIndex((x, k) => iso(x) >= today && anyGame(k)));
  const { day, past, hasGame: g1, avail: a1, slotOf, onTeam, slots, spots, espnOn, mv, suggested, better } = lineupBase(d, i);
  const hasGame = r => g1(r), avail = r => a1(r);
  // your choices for this day: {player id: starts?} on top of ESPN's lineup
  const ov = lineup.choice[day] || {};
  const starts = r => ov[r.id] ?? espnOn(r);
  const sugOv = Object.fromEntries(onTeam.filter(r => avail(r)).map(r => [r.id, suggested.has(r.id)]));
  // what your choices change this week: started games that count now minus ones ESPN's lineup counted
  const counts = (r, on) => on && avail(r) && !past;
  const extra = Object.fromEntries(KEYS.map(k => [k, 0]));
  for (const r of onTeam) {
    const delta = (counts(r, starts(r)) ? 1 : 0) - (counts(r, espnOn(r)) ? 1 : 0);
    if (delta) for (const k of KEYS) extra[k] += delta * (r.avg[k] || 0);
  }
  const playingNow = onTeam.filter(r => starts(r) && avail(r));
  const valid = !slots || fitsLineup(playingNow.map(r => r.elig || []), slots);
  const changed = onTeam.some(r => starts(r) !== espnOn(r));
  const cols = ["PTS", "REB", "AST", "3PM", "STL", "BLK", "TO"];
  const order = ["PG", "SG", "SF", "PF", "C", "G", "F", "SG/SF", "G/F", "PF/C", "F/C", "UT", "BE", "IR"];  // ESPN's slot order
  const rank = r => { const k = order.indexOf(slotOf(r)); return k < 0 ? order.length - 2 : k; };
  const slotName = x => ({ UT: "UTIL", BE: "Bench" })[x] || x;
  const body = [...onTeam].sort((a, b) => rank(a) - rank(b) || better(a, b)).map(r => {
    const g = hasGame(r), out = r.days[i] === "out";
    const toggle = !g ? `<span class="muted">No game</span>` : out ? `<span class="inj">OUT</span>` : past ? `<span class="muted">${espnOn(r) ? "Started" : "Bench"}</span>`
      : `<button class="switch" role="switch" data-lstart="${r.id}" aria-checked="${starts(r)}" aria-label="${esc(r.name)} starts">${starts(r) ? "Start" : "Sit"}</button>`;
    const sug = g && !out ? (suggested.has(r.id) ? "Start" : "Sit") : "";
    return `<tr class="${starts(r) !== espnOn(r) ? "lu-change" : ""}${g ? "" : " lu-idle"}">
      <td class="lu-slot">${slotName(slotOf(r))}</td>
      <th scope="row"><img class="pic sm" src="${headshot(r.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"> ${esc(r.name)}${r.injury ? ` <span class="inj">${esc(r.injury.replace("_", " "))}</span>` : ""}
        <small>${esc(r.team)} · ${esc((r.elig || []).filter(x => ["PG", "SG", "SF", "PF", "C"].includes(x)).join(", "))}</small></th>
      <td>${g ? esc(r.opps[i]) : "—"}</td><td>${toggle}</td><td class="${sug === "Start" ? "pos" : "neg"}">${sug}</td>
      ${g ? cols.map(c => `<td>${perGame(c, r.avg[c] || 0)}</td>`).join("") + `<td>${perGame("FG%", lineVal(r.avg, "FG%"))}</td><td>${perGame("FT%", lineVal(r.avg, "FT%"))}</td>
        <td>${mv[r.id] != null ? `+${mv[r.id].toFixed(2)}` : "—"}</td>
        <td class="${(r.value ?? 0) >= 0 ? "pos" : "neg"}">${(r.value ?? 0) >= 0 ? "+" : ""}${(r.value ?? 0).toFixed(1)}</td>` : `<td colspan="11"></td>`}</tr>`;
  }).join("");
  const chips = days.map((x, k) => `<button class="chip day" data-lday="${iso(x)}" aria-pressed="${k === i}">${x.toLocaleDateString(undefined, { weekday: "short" })} ${rows.filter(r => r.opps[k] && !["off", "out"].includes(r.days[k])).length}</button>`).join("");
  const nAvail = onTeam.filter(r => avail(r)).length;
  return `${d.projection ? lineupTotals(d, extra, changed, day) : ""}
  <section class="card wide"><div class="slate-head"><h2>Lineup · ${gameDay(day)}</h2>
      <span class="muted">${nAvail} with a game for ${spots} spots</span></div>
    <div class="day-chips" role="group" aria-label="Day (number of your players with a game)">${chips}</div>
    ${nAvail > spots ? `<p><b>${nAvail - spots} more with a game than spots:</b> someone has to sit.</p>` : ""}
    ${!valid ? `<p class="error">These starters don't fit your lineup slots (${esc(slots.join(", "))}): too many at one position. Sit someone.</p>` : ""}
    ${playingNow.length > spots ? `<p class="error">${playingNow.length} starters with a game for ${spots} spots.</p>` : ""}
    <div class="lu-actions"><button class="ghost" data-lset="suggest" data-ov='${JSON.stringify(sugOv)}'>Use suggested lineup</button><button class="ghost" data-lset="espn">Reset to ESPN</button></div>
    <div class="h2h-scroll"><table class="guide lineup"><thead><tr><th scope="col">Slot</th><th scope="col">Player</th><th scope="col">Opp</th><th scope="col">Start / Sit</th><th scope="col">Suggest</th>
      ${cols.map(c => `<th scope="col">${c}</th>`).join("")}<th scope="col">FG%</th><th scope="col">FT%</th><th scope="col">Matchup</th><th scope="col">Value</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <p class="muted">Slot = where ESPN has him for this day. Start / Sit begins as ESPN's lineup; flip players to try a lineup (the site can't change ESPN, so set it there).
      Projected stats are per game. Matchup = categories you're expected to win this week that his game that day adds
      (close categories count, decided ones don't). Suggest = the lineup with the most matchup value that fits your slots; Value
      (9-category impact per game, 0 = average) breaks ties. Highlighted rows differ from ESPN.${past ? " This day is over: its lineup can't change." : ""}</p></section>`;
}

// Category totals this week with ESPN's lineup vs with your start/sit choices for the day picked
function lineupTotals(d, extra, changed, day) {
  const base = matchupOdds(d), mine = matchupOdds(d, extra);
  const res = o => Object.fromEntries(CATS9.map(c => [c, cmpCat(c, o.mine[c] || 0, o.theirs[c] || 0)]));
  const rb = res(base), rm = res(mine), rec = r => tally(r).slice(0, 2).join("-");
  const pc = x => `${Math.round(x * 100)}%`;
  const rowsHtml = CATS9.map(c => {
    const a = base.mine[c] || 0, b = mine.mine[c] || 0, diff = b - a, pct = c.endsWith("%");
    const moved = Math.abs(diff) > (pct ? 0.0005 : 0.05);
    const good = c === "TO" ? diff < 0 : diff > 0;
    return `<tr><th scope="row">${c}</th><td>${fmt(c, a)}</td><td>${moved ? `<b>${fmt(c, b)}</b> <span class="${good ? "pos" : "neg"}">${diff > 0 ? "+" : "−"}${pct ? (Math.abs(diff) * 100).toFixed(1) + " pts" : Math.abs(diff).toFixed(1)}</span>` : fmt(c, b)}</td>
      <td>${fmt(c, mine.theirs[c] || 0)}</td><td class="${rm[c] === "W" ? "pos" : rm[c] === "L" ? "neg" : ""}">${rm[c]}</td>
      <td>${pc(base.prob[c])}${Math.round(base.prob[c] * 100) !== Math.round(mine.prob[c] * 100) ? ` → <b>${pc(mine.prob[c])}</b>` : ""}</td></tr>`;
  }).join("");
  return `<section class="card wide"><h2>This week's totals · your ${gameDay(day)} lineup</h2>
    <p><b>Projected ${rec(rb)} · ${base.expected.toFixed(1)} categories expected</b> with ESPN's lineup${changed
      ? ` → <b>${rec(rm)} · ${mine.expected.toFixed(1)}</b> with your changes (win ${pc(base.win)} → ${pc(mine.win)})` : " · flip Start / Sit below to compare"}.</p>
    <div class="h2h-scroll"><table class="lu-totals"><thead><tr><th scope="col">Cat</th><th scope="col">ESPN lineup</th><th scope="col">Your lineup</th>
      <th scope="col">${esc(d.opponent || "Opponent")}</th><th scope="col">Result</th><th scope="col">Win %</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
    <p class="muted">Projected week-end totals: this week so far + the rest of the week, with the day picked using your Start / Sit choices (other days as set on ESPN).</p></section>`;
}

function plannerView(d) {
  return `<div class="stack">${matchupGamesCard(d)}${teamGamesCard(d)}</div>${rosterGuideCard(d)}`;
}


// Live category scores from ESPN for the selected week, with who leads each one
// ---- Versus view: left side vs right side, categories in the middle, winning side filled ----
const lineVal = (l, c) => c === "FG%" ? (l.FGA ? l.FGM / l.FGA : 0) : c === "FT%" ? (l.FTA ? l.FTM / l.FTA : 0) : (l[c] || 0);
const cmpCat = (c, a, b) => { if (c === "TO") [a, b] = [b, a]; return a > b + 1e-9 ? "W" : b > a + 1e-9 ? "L" : "T"; };
const perGame = (c, v) => c.endsWith("%") ? (v ? v.toFixed(3).replace(/^0/, "") : "—") : (Math.round(v * 10) / 10).toFixed(1);

function vsRows(cats, left, right, res, show = fmt, sub = null) {
  return `<div class="vs" role="table">${cats.map(c => {
    const r = res[c], L = r === "W" ? "win" : r === "L" ? "lose" : "", R = r === "L" ? "win" : r === "W" ? "lose" : "";
    return `<div class="vs-row" role="row">
      <span class="vs-val left ${L}" role="cell">${show(c, left[c] || 0)}${r === "W" ? '<span class="sr"> (winning)</span>' : ""}${sub ? `<small>${sub(c)}</small>` : ""}</span>
      <span class="vs-cat" role="rowheader">${c}</span>
      <span class="vs-val right ${R}" role="cell">${show(c, right[c] || 0)}${r === "L" ? '<span class="sr"> (winning)</span>' : ""}</span></div>`;
  }).join("")}</div>`;
}

function vsHead(left, right, mid = "VS") {
  const side = (x, cls) => `<div class="vs-side ${cls}">${x.id ? `<img class="pic lg" src="${headshot(x.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ""}
    <span><b>${esc(x.name)}</b>${x.sub ? `<small>${x.sub}</small>` : ""}</span></div>`;
  return `<div class="vs-head">${side(left, "left")}<span class="vs-badge">${mid}</span>${side(right, "right")}</div>`;
}

// What a player's projected line is based on: his recent games (or ESPN's season average), times fresh role news
const basisText = x => x.basis === "recent" ? "recent games" : "season averages";
const adjText = x => x.factor && Math.abs(x.factor - 1) >= 0.005
  ? `Projection: ${basisText(x)} ×${x.factor.toFixed(2)}${x.note ? ` · ${esc(x.note)}` : ""}` : `Projection: ${basisText(x)}`;

// What one side of a move brings to (+) or takes from (−) this week's matchup: games and projected stats
const gamesText = (games, sign) => games
  ? `${sign > 0 ? "+" : "−"}${games} game${games === 1 ? "" : "s"} this week` : "No games left this week";

// The move's net effect on your projected totals this week (after − before): green helps, red hurts (TO: fewer helps)
function netLine(m) {
  const c = m.change || {};
  const part = (k, v, text) => `<span class="${(k === "TO" ? v < 0 : v > 0) ? "pos" : "neg"}">${v > 0 ? "+" : "−"}${text} ${k}</span>`;
  const parts = ["PTS", "REB", "AST", "3PM", "STL", "BLK", "TO"].filter(k => Math.round(c[k] || 0)).map(k => part(k, c[k], Math.abs(Math.round(c[k]))))
    .concat(["FG%", "FT%"].filter(k => Math.abs((c[k] || 0) * 100) >= 0.05).map(k => part(k, c[k], `${Math.abs(c[k] * 100).toFixed(1)} pts`)));
  return `<p class="net"><b>Net this week:</b> ${parts.length ? parts.join(" · ") : "no change to your totals"}</p>`;
}

// The add's and drop's last 3 games, then their games ahead (this week and next) with opponents
function formTable(m) {
  const name = x => esc(x.name.replace(/ \(\w+\)$/, ""));
  const cols = ["PTS", "REB", "AST", "3PM", "STL", "BLK", "TO"];
  const rows = [[m.add, "Add"], [m.drop, m.ir ? "IR" : "Drop"]].flatMap(([x, verb]) => (x.recent || []).map((g, i) => `<tr>
    <th scope="row">${i ? "" : `${verb} ${name(x)}`}</th><td>${gameDay(g.date)}</td><td>${g.at === "@" ? "@" : "vs"} ${esc(g.opp)}</td>
    <td>${Math.round(g.MIN)}</td>${cols.map(c => `<td>${+g[c]}</td>`).join("")}<td>${pct(`${g.FGM}-${g.FGA}`)}</td><td>${pct(`${g.FTM}-${g.FTA}`)}</td></tr>`));
  const ahead = [[m.add, "Add"], [m.drop, m.ir ? "IR" : "Drop"]].map(([x, verb]) => `<li><b>${verb} ${name(x)}</b>: ${(x.upcoming || []).length
    ? x.upcoming.map(g => `${gameDay(g.date)} ${esc(g.opp)}`).join(" · ") : "no games through next week"}</li>`).join("");
  return `${rows.length ? `<div class="h2h-scroll"><table class="last3"><caption>Last 3 games</caption>
      <thead><tr><th scope="col">Player</th><th scope="col">Date</th><th scope="col">Opp</th><th scope="col">MIN</th>${cols.map(c => `<th scope="col">${c}</th>`).join("")}<th scope="col">FG%</th><th scope="col">FT%</th></tr></thead>
      <tbody>${rows.join("")}</tbody></table></div>` : ""}
    <ul class="ahead"><li class="muted">Games ahead (this week + next)</li>${ahead}</ul>`;
}

const tally = res => { const n = r => Object.values(res).filter(x => x === r).length; return [n("W"), n("L"), n("T")]; };
const scoreLine = (res, oppName) => { const [w, l, t] = tally(res);
  return `<div class="vs-score"><span class="you">${w}</span><small>you · ${t} tied · ${esc(oppName)}</small><span class="opp">${l}</span></div>`; };



// One row per counted player: their projected stats for the rest of the week.
function breakdownTable(team, players, current, total) {
  const one = v => (Math.round(v * 10) / 10).toString();
  const pctCell = (m, a) => `<td>${a ? pct(`${m}-${a}`) : "—"}<small>${one(m)}-${one(a)}</small></td>`;
  const counting = ["3PM", "PTS", "REB", "AST", "STL", "BLK", "TO"];
  const head = `<tr><th scope="col">Player</th><th scope="col">G</th><th scope="col">FG%</th><th scope="col">FT%</th>${counting.map(c => `<th scope="col">${c}</th>`).join("")}</tr>`;
  const rows = players.map(r => `<tr><th scope="row">${esc(r.name)}</th><td>${r.games}</td>${pctCell(r.FGM, r.FGA)}${pctCell(r.FTM, r.FTA)}${counting.map(c => `<td>${one(r[c])}</td>`).join("")}</tr>`).join("");
  const sofar = `<tr><th scope="row">So far this week</th><td></td><td>${fmt("FG%", current["FG%"] || 0)}</td><td>${fmt("FT%", current["FT%"] || 0)}</td>${counting.map(c => `<td>${one(current[c] || 0)}</td>`).join("")}</tr>`;
  const sum = `<tr class="sum"><th scope="row">Projected</th><td></td><td>${fmt("FG%", total["FG%"])}</td><td>${fmt("FT%", total["FT%"])}</td>${counting.map(c => `<td>${fmt(c, total[c])}</td>`).join("")}</tr>`;
  return `<h3>${esc(team)}</h3><div class="h2h-scroll"><table><thead>${head}</thead><tbody>${rows}${sofar}${sum}</tbody></table></div>`;
}

let week = null;  // selected matchup week; null until the first load tells us the current one
let currentWeek = null;
let openPlayer = null;  // roster row whose games/news panel is open, kept open when fresh data arrives
let lastData = null;

function render(d) {
  lastData = d;
  const page = ["#today", "#planner", "#lineup", "#streaming", "#scout", "#accuracy"].includes(location.hash) ? location.hash : "#";
  $("#app").classList.toggle("planner", page !== "#");
  document.querySelectorAll(".nav-row a").forEach(a => a.getAttribute("href") === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  $("#app").innerHTML = page === "#today" ? todayView(d) : page === "#planner" ? plannerView(d) : page === "#lineup" ? lineupView(d) : page === "#scout" ? scoutView(d) : page === "#streaming" ? streamView() : page === "#accuracy" ? accuracyView()
    : matchupCard(d) + rosterCard(d);
}
window.addEventListener("hashchange", () => { closeH2H(); if (lastData) render(lastData); });
$("#app").addEventListener("click", e => {  // lineup page: pick a day, flip start/sit, or reset
  const day = e.target.closest("[data-lday]"), flip = e.target.closest("[data-lstart]"), set = e.target.closest("[data-lset]");
  if (day) { lineup.day = day.dataset.lday; return render(lastData); }
  const go = e.target.closest("[data-lday-go]");
  if (go) lineup.day = go.dataset.ldayGo;  // Today -> Lineup opens on the day it talked about
  if (!flip && !set) return;
  const cur = $("#app [data-lday][aria-pressed='true']")?.dataset.lday;
  if (!cur) return;
  if (set && set.dataset.lset === "espn") delete lineup.choice[cur];
  else if (set) lineup.choice[cur] = JSON.parse(set.dataset.ov);
  else lineup.choice[cur] = { ...(lineup.choice[cur] || {}), [flip.dataset.lstart]: flip.getAttribute("aria-checked") !== "true" };
  render(lastData);
});
// Phone menu: the ☰ button opens the page list; any choice in it, Escape, or a tap outside closes it
const menu = $(".menu-toggle"), setMenu = open => { document.querySelector("header").classList.toggle("menu-open", open); menu.setAttribute("aria-expanded", open); };
menu.onclick = () => setMenu(menu.getAttribute("aria-expanded") !== "true");
$("#pages").addEventListener("click", e => { if (e.target.closest("a, button")) setMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && menu.getAttribute("aria-expanded") === "true") { setMenu(false); menu.focus(); } });
document.addEventListener("click", e => { if (!e.target.closest("header")) setMenu(false); });

let loadGen = 0;  // newer loads cancel older ones' follow-up checks

async function load(refresh = false, poll = 0) {
  const gen = poll ? loadGen : ++loadGen;
  if (!poll) closeH2H();
  if (refresh) { Object.assign(stream, { data: null, plan: null }); acc.data = null; }  // other pages refetch too
  if (!poll) document.querySelectorAll(".picker button, .picker select").forEach(x => x.disabled = true);
  try {
    const q = new URLSearchParams();
    if (week && week !== currentWeek) q.set("week", week);  // the current week shares one server cache entry, kept fresh in the background
    if (refresh) q.set("refresh", "true");
    const r = await fetch("/api/dashboard?" + q);
    const d = await r.json().catch(() => ({ detail: `${r.status} ${r.statusText}` }));  // non-JSON error pages
    if (!r.ok) throw new Error(d.detail || r.statusText);
    if (gen !== loadGen) return;  // the user picked another week meanwhile
    if (week !== d.week.number) openPlayer = null;
    week = d.week.number;
    currentWeek = d.week.current;
    $("#team").innerHTML = `${esc(d.team)}<small>${esc(d.league)}</small>`;
    $("#updated").textContent = (d.updated ? "Updated " + new Date(d.updated).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "")
      + (d.pending ? " · updating…" : "") + (d.warning ? ` · ${d.warning}` : "");
    render(d);
    // the server sent saved or partial data and is building the rest: check back until it's done (about 1 minute max)
    if (d.pending && poll < 30) setTimeout(() => gen === loadGen && load(false, poll + 1), 2000);
  } catch (e) {
    if (gen !== loadGen) return;
    if (poll) return;  // keep what's on screen if a follow-up check fails
    $("#app").innerHTML = `<p class="error">Could not load league: ${esc(e.message)}</p>`;
  }
}

const H2H_CATS = ["FG%", "FT%", "3PM", "PTS", "REB", "AST", "STL", "BLK", "TO"];
const h2hCache = {};
let h2hChip = null;
const pct = ma => { const [m, a] = ma.split("-").map(Number); return a ? (m / a).toFixed(3).replace(/^0/, "") : "—"; };

function h2hTable(name, d) {
  if (!d.games.length) return `<p class="muted">No games vs ${esc(d.opp)} in the last ${d.seasons} seasons.</p>`;
  const head = H2H_CATS.map(c => `<th scope="col">${c}</th>`).join("");
  const rows = d.games.map(g => `<tr><th scope="row">${esc(g.date)}<small>${esc(g.at)} ${esc(d.opp)} · ${esc(g.result)}</small></th>${
    H2H_CATS.map(c => c.endsWith("%") ? `<td>${pct(g.stats[c])}<small>${esc(g.stats[c])}</small></td>` : `<td>${esc(g.stats[c])}</td>`).join("")}</tr>`).join("");
  return `<div class="h2h-scroll"><table><thead><tr><th scope="col">Game</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function closeH2H() {
  $("#h2h").hidden = true;
  if (h2hChip) { h2hChip.setAttribute("aria-expanded", "false"); h2hChip = null; }
}

async function openH2H(chip) {
  closeH2H();
  h2hChip = chip;
  chip.setAttribute("aria-expanded", "true");
  const pop = $("#h2h"), { h2h: id, opp, name } = chip.dataset, key = id + "/" + opp;
  $("#h2h-title").textContent = `${name}: last 3 games vs ${opp}`;
  $("#h2h-body").innerHTML = `<p class="muted">Loading…</p>`;
  pop.hidden = false;
  const r = chip.getBoundingClientRect();
  pop.style.top = `${r.bottom + scrollY + 6}px`;
  pop.style.left = `${Math.max(16, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 16))}px`;
  try {
    if (!h2hCache[key]) {
      const res = await fetch(`/api/vs/${id}/${encodeURIComponent(opp)}`);
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || `${res.status} ${res.statusText}`);
      h2hCache[key] = await res.json();
    }
    if (h2hChip === chip) $("#h2h-body").innerHTML = h2hTable(name, h2hCache[key]);
  } catch (err) {
    if (h2hChip === chip) $("#h2h-body").innerHTML = `<p class="muted">Couldn't load stats: ${esc(err.message)}</p>`;
  }
}

document.addEventListener("click", e => {
  const chip = e.target.closest("[data-h2h]");
  if (chip) return chip === h2hChip ? closeH2H() : openH2H(chip);
  if (!e.target.closest("#h2h")) closeH2H();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && h2hChip) { const c = h2hChip; closeH2H(); c.focus(); }
});

// Clicking anywhere on a player's row toggles their panel; only one panel stays open.
$("#app").addEventListener("click", e => {
  const row = e.target.closest(".player > .row");
  if (!row) return;
  const b = row.querySelector("[data-news]"), open = b.getAttribute("aria-expanded") !== "true";
  document.querySelectorAll("[data-news]").forEach(x => {
    x.setAttribute("aria-expanded", "false");
    $("#news-" + x.dataset.news).classList.remove("open");
  });
  b.setAttribute("aria-expanded", open);
  $("#news-" + b.dataset.news).classList.toggle("open", open);
  openPlayer = open ? Number(b.dataset.news) : null;
  clearTimeout(liveTimer);
  if (open) {  // today's game and last 3 games, fetched when the panel opens
    const id = lastData.roster[openPlayer].id;
    document.querySelector(`[data-live="${id}"]`).innerHTML = liveHtml(id);
    loadLive(id);
  }
});
$("#refresh").onclick = () => load(true);
const themeLabel = () => { const dark = document.documentElement.dataset.theme === "dark";
  $("#theme").textContent = dark ? "Light" : "Dark"; $("#theme").setAttribute("aria-label", `Switch to ${dark ? "light" : "dark"} mode`); };
$("#theme").onclick = () => {
  try { localStorage.setItem("theme", document.documentElement.dataset.theme === "dark" ? "light" : "dark"); } catch {}
  applyTheme(); themeLabel();
};
themeDark.addEventListener("change", themeLabel);
themeLabel();
let planTimer;
const planSoon = () => { clearTimeout(planTimer); planTimer = setTimeout(() => loadStream(true), 500); };  // wait for quick flips
$("#app").addEventListener("input", e => { if (e.target.id === "acq") { stream.acq = e.target.value; planSoon(); } });
$("#app").addEventListener("click", e => {
  const sw = e.target.closest("[data-drop]");
  if (!sw) return;
  const id = Number(sw.dataset.drop);
  drops.has(id) ? drops.delete(id) : drops.add(id);
  try { localStorage.setItem("drops", JSON.stringify([...drops])); } catch {}
  sw.setAttribute("aria-checked", drops.has(id));  // update in place so focus stays put
  sw.textContent = drops.has(id) ? "Droppable" : "Stay";
  planSoon();
});
// Week picker: every card reloads for the chosen matchup week
$("#app").addEventListener("click", e => {
  const b = e.target.closest("[data-week]");
  if (b) { week = Number(b.dataset.week); load(); }
});
$("#app").addEventListener("change", e => {
  if (e.target.id === "week") { week = Number(e.target.value); load(); }
  if (e.target.id === "pl-roster") { planner.roster = e.target.value; render(lastData); }
  if (e.target.id === "pl-stat") { planner.stat = e.target.value; render(lastData); }

});
// Games-per-team chips filter the roster guide
$("#app").addEventListener("click", e => {
  const x = e.target.closest("[data-expand]");
  if (x) {
    const id = Number(x.dataset.expand);
    planner.open.has(id) ? planner.open.delete(id) : planner.open.add(id);
    render(lastData);
    return document.querySelector(`[data-expand="${id}"]`)?.focus();
  }
  const ab = e.target.closest("[data-acc]");
  if (ab) {  // accuracy page: show / hide a player's last 10 games
    const id = Number(ab.dataset.acc);
    acc.open.has(id) ? acc.open.delete(id) : acc.open.add(id);
    render(lastData);
    return document.querySelector(`[data-acc="${id}"]`)?.focus();
  }
  const sw = e.target.closest("[data-toggle]");
  if (sw) {  // who-plays switch: flip plays/sits and recompute the matchup odds
    const id = sw.dataset.toggle;
    sits[id] = sw.getAttribute("aria-checked") === "true";
    render(lastData);
    return document.querySelector(`[data-toggle="${id}"]`)?.focus();
  }
  const dayBtn = e.target.closest("[data-day]");
  if (dayBtn) {  // games-per-team day filter: "All" clears, a day toggles
    const v = dayBtn.dataset.day;
    if (v === "all") planner.days.clear(); else planner.days.has(+v) ? planner.days.delete(+v) : planner.days.add(+v);
    render(lastData);
    return document.querySelector(`[data-day="${v}"]`)?.focus();
  }
  const t = e.target.closest("[data-team]");
  if (!t) return;
  planner.teams.has(t.dataset.team) ? planner.teams.delete(t.dataset.team) : planner.teams.add(t.dataset.team);
  render(lastData);
  document.querySelector(`[data-team="${t.dataset.team}"]`)?.focus();
});
load();
</script>
</body>
</html>
